<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="description" content="Shows, to-dos and notes">

<link rel="icon" type="image/png" href="icon-192.png">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/1206x2622.png">

<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/1125x2436.png">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/828x1792.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1A1C2C;
    --panel: #333C57;
    --panel-edge: #29366F;
    --panel-hi: #566C86;
    --text: #F4F4F4;
    --muted: #94B0C2;
    --orange: #EF7D57;
    --yellow: #FFCD75;
    --cyan: #73EFF7;
    --green: #A7F070;
    --blue: #41A6F6;
    --red: #B13E53;
    --ink: #1A1C2C;
    --well-edge: var(--well-edge);
    --hi-edge: var(--hi-edge);
    --cyan-edge: var(--cyan-edge);
    --green-edge: var(--green-edge);
    --blue-edge: var(--blue-edge);
    --red-edge: var(--red-edge);
    --t-cyan: #73EFF7;
    --t-yellow: #FFCD75;
    --t-green: #A7F070;
    --t-orange: #EF7D57;
    --t-blue: #41A6F6;
    --t-red: #E0687E;
    --accent: #EF7D57;
    --accent-edge: #B5513A;
    --t-accent: #EF7D57;
    --fs: 1;
    --px: 'Silkscreen', monospace;
    --body: 'Pixelify Sans', monospace;
    --tabbar-h: 64px;
  }
  html[data-theme="light"] {
    --bg: #E9EDF2;
    --panel: #FFFFFF;
    --panel-edge: #C9D3DD;
    --panel-hi: #8597A8;
    --text: #1A1C2C;
    --muted: #566C86;
    --well-edge: #C9D3DD;
    --hi-edge: #5F7184;
    --t-cyan: #17808A;
    --t-yellow: #9C6A0B;
    --t-green: #3B7F1D;
    --t-orange: #B8492A;
    --t-blue: var(--blue-edge);
    --t-red: #B13E53;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    overscroll-behavior-y: none;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    font-size: calc(16px * var(--fs));
    line-height: 1.4;
    min-height: 100vh;
  }

  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 20px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 32px);
  }


  /* === HEADER === */
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .logo { font-family: var(--px); font-size: calc(26px * var(--fs)); letter-spacing: 1px; }
  .logo span { color: var(--t-accent); }
  .tab-label { font-family: var(--px); font-size: calc(12px * var(--fs)); color: var(--muted); }

  .top-right { display: flex; align-items: center; gap: 12px; }
  .gear {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    background: var(--panel); color: var(--muted); box-shadow: inset 0 -3px 0 var(--panel-edge);
  }
  .gear svg { width: 20px; height: 20px; }
  .gear.on { background: var(--accent); color: var(--ink); box-shadow: inset 0 -3px 0 var(--accent-edge); }

  /* === SWIPE + TOAST === */
  .item { position: relative; touch-action: pan-y; transition: transform .18s ease-out; }
  .item.swiping { transition: none; }
  .item.swipe-r { box-shadow: inset 0 -4px 0 var(--panel-edge), inset 6px 0 0 var(--green); }
  .item.swipe-l { box-shadow: inset 0 -4px 0 var(--panel-edge), inset -6px 0 0 var(--red); }
  .toast {
    position: fixed; left: 12px; right: 12px; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);
    max-width: 616px; margin: 0 auto; z-index: 20;
    display: none; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--text); color: var(--bg); padding: 6px 6px 6px 14px;
    font-family: var(--px); font-size: calc(12px * var(--fs));
  }
  .toast.show { display: flex; }
  .toast button { font-family: var(--px); font-size: calc(12px * var(--fs)); background: var(--accent); color: var(--ink); min-height: 40px; padding: 0 14px; }

  /* === SEARCH === */
  .flash { animation: flash 1.2s steps(4); }
  @keyframes flash { 0%, 50% { outline: 3px solid var(--accent); outline-offset: 2px; } 100% { outline: 3px solid transparent; } }
  .res {
    display: block; width: 100%; text-align: left; background: var(--panel);
    box-shadow: inset 0 -3px 0 var(--panel-edge); padding: 12px 14px 14px; margin-bottom: 6px;
  }
  .res-t { font-size: calc(16px * var(--fs)); overflow-wrap: anywhere; }
  .res-m { font-family: var(--px); font-size: calc(11px * var(--fs)); color: var(--muted); margin-top: 2px; }

  /* === ACCOUNT === */
  .acct-msg { font-family: var(--px); font-size: calc(11px * var(--fs)); color: var(--muted); margin-top: 10px; min-height: 14px; overflow-wrap: anywhere; }
  .acct-msg.err { color: var(--t-orange); }
  .acct-who { font-size: calc(16px * var(--fs)); overflow-wrap: anywhere; margin-bottom: 4px; }
  .acct-row { display: flex; gap: 8px; margin-top: 12px; }
  .acct-row > * { flex: 1; }
  .sync-dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; background: var(--panel-hi); vertical-align: 1px; }
  .sync-dot.ok { background: var(--green); }
  .sync-dot.busy { background: var(--yellow); }
  .sync-dot.bad { background: var(--orange); }

  .credit { font-family: var(--px); font-size: calc(11px * var(--fs)); color: var(--muted); text-align: center; margin-top: 18px; }
  .credit a { color: var(--t-accent); }
  .st.active[data-state="beaten"] { background: var(--yellow); color: var(--ink); box-shadow: inset 0 -3px 0 #C99A48; }
  .st.active[data-state="hundred"] { background: var(--green); color: var(--ink); box-shadow: inset 0 -3px 0 var(--green-edge); }
  .st.active[data-state="backlog"] { background: var(--panel-hi); color: #FFFFFF; box-shadow: inset 0 -3px 0 var(--hi-edge); }
  .st.active[data-state="playing"] { background: var(--cyan); color: var(--ink); box-shadow: inset 0 -3px 0 var(--cyan-edge); }
  .cover.wide { width: 88px; height: 50px; }

  /* === LOGIN SCREEN === */
  .auth {
    position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto;
    display: none; padding: calc(env(safe-area-inset-top) + 48px) 20px calc(env(safe-area-inset-bottom) + 32px);
  }
  .auth.show { display: block; }
  .auth-inner { max-width: 420px; margin: 0 auto; }
  .auth-logo { font-family: var(--px); font-size: calc(40px * var(--fs)); letter-spacing: 1px; text-align: center; }
  .auth-logo span { color: var(--t-accent); }
  .auth-icon { display: block; width: 88px; height: 88px; margin: 0 auto 16px; image-rendering: pixelated; }
  .auth-sub { text-align: center; color: var(--muted); font-size: calc(15px * var(--fs)); margin: 6px 0 28px; }
  .auth-card { background: var(--panel); box-shadow: inset 0 -4px 0 var(--panel-edge); padding: 18px 16px 20px; }
  .auth-card .add-input { margin-bottom: 4px; }
  .auth-card .add-btn { width: 100%; margin-top: 14px; }
  .auth-links { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; margin-top: 14px; }
  .auth-guest { display: block; margin: 22px auto 0; }

  /* === GAME TASKS === */
  .tasks-toggle {
    width: 100%; margin-top: 12px; min-height: 40px; display: flex; justify-content: space-between; align-items: center;
    font-family: var(--px); font-size: calc(11px * var(--fs)); color: var(--muted);
    background: var(--bg); padding: 0 12px; box-shadow: inset 0 -3px 0 var(--well-edge);
  }
  .tasks-toggle b { font-weight: 400; color: var(--t-green); }
  .tasks { background: var(--bg); padding: 8px; margin-top: 2px; }
  .task { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .task .check { width: 36px; height: 36px; background: var(--panel); }
  .task.done .check { background: var(--green); }
  .task.done .check svg { visibility: visible; }
  .task-text { flex: 1; min-width: 0; font-size: calc(15px * var(--fs)); overflow-wrap: anywhere; }
  .task.done .task-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--t-green); }
  .task .del { min-width: 44px; height: 32px; }
  .task-form { display: flex; gap: 6px; margin-top: 6px; }
  .task-form .add-input { padding: 9px 10px; border-width: 2px; }
  .task-form .add-btn { min-height: 42px; padding: 0 12px; font-size: calc(12px * var(--fs)); }

  /* === TO-DO CATEGORIES === */
  .chip.cat-edit { color: var(--t-red); }
  .chip .x { margin-left: 6px; color: var(--t-red); }
  .chip.dashed { background: transparent; box-shadow: inset 0 0 0 2px var(--panel); }
  .todo-cat-head { margin-top: 14px; }
  .item .cat-tag { font-family: var(--px); font-size: calc(10px * var(--fs)); color: var(--muted); background: var(--bg); padding: 2px 5px; flex-shrink: 0; }

  /* === SETTINGS === */
  .set-group { background: var(--panel); box-shadow: inset 0 -4px 0 var(--panel-edge); padding: 14px 14px 18px; margin-bottom: 12px; }
  .set-title { font-family: var(--px); font-size: calc(13px * var(--fs)); margin-bottom: 4px; }
  .swatches { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .swatch { height: 44px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); position: relative; }
  .swatch.on::after { content: ''; position: absolute; inset: 14px; background: var(--ink); }
  .font-sample { font-size: calc(14px * var(--fs)); color: var(--muted); margin-top: 10px; }
  .font-sample b { font-family: var(--px); font-weight: 400; color: var(--text); }
  .data-row { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; }

  /* === STATS === */
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--panel); box-shadow: inset 0 -4px 0 var(--panel-edge); padding: 12px 12px 14px; }
  .stat-label { font-family: var(--px); font-size: calc(11px * var(--fs)); color: var(--muted); display: block; }
  .stat-value { font-family: var(--px); font-size: calc(26px * var(--fs)); line-height: 1.1; }
  .stat-value.y { color: var(--t-yellow); }
  .stat-value.c { color: var(--t-cyan); }
  .stat-value.g { color: var(--t-green); }

  /* === CHIPS === */
  .chips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 8px; padding: 0 16px 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    font-family: var(--px); font-size: calc(11px * var(--fs)); white-space: nowrap;
    background: var(--panel); color: var(--muted);
    padding: 10px 14px; min-height: 40px;
    box-shadow: inset 0 -3px 0 var(--panel-edge); flex-shrink: 0;
  }
  .chip.active { background: var(--accent); color: var(--ink); box-shadow: inset 0 -3px 0 var(--accent-edge); }

  /* === SECTIONS === */
  .section-head { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; }
  .section-head .big { font-family: var(--px); font-size: calc(15px * var(--fs)); line-height: 1; }
  .section-head .rule { flex: 1; height: 4px; background: var(--panel); }
  .section-head .count { font-family: var(--px); font-size: calc(11px * var(--fs)); color: var(--muted); }
  .sec-active .big { color: var(--t-cyan); }
  .sec-next .big { color: var(--t-yellow); }
  .sec-done .big { color: var(--t-green); }

  /* === CARDS === */
  .card { background: var(--panel); box-shadow: inset 0 -4px 0 var(--panel-edge); padding: 12px 14px 16px; margin-bottom: 8px; }
  .card-top { display: flex; align-items: flex-start; gap: 10px; }
  .card-main { flex: 1; min-width: 0; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .tag { font-family: var(--px); font-size: calc(11px * var(--fs)); padding: 2px 6px; background: var(--bg); color: var(--muted); }
  .tag.anime, .tag.physical { color: var(--t-orange); }
  .tag.live, .tag.audio { color: var(--t-cyan); }
  .tag.airing { background: var(--yellow); color: var(--ink); }
  .card-title { font-size: calc(19px * var(--fs)); font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
  .card-sub { font-size: calc(14px * var(--fs)); color: var(--muted); margin-top: 2px; }
  .card.is-done .card-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--t-green); text-decoration-thickness: 2px; }
  .card.rewatched .card-title { color: var(--t-blue); text-decoration: none; }

  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
  .card-len { font-family: var(--px); font-size: calc(12px * var(--fs)); color: var(--muted); }
  .card-len span { color: var(--text); }

  .status { display: flex; gap: 6px; }
  .st {
    width: 44px; height: 44px; background: var(--bg); color: var(--panel-hi);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 -3px 0 var(--well-edge);
  }
  .st svg { width: 18px; height: 18px; }
  .st.active[data-state="not-started"], .st.active[data-state="want"] { background: var(--panel-hi); color: #FFFFFF; box-shadow: inset 0 -3px 0 var(--hi-edge); }
  .st.active[data-state="watching"], .st.active[data-state="reading"] { background: var(--cyan); color: var(--ink); box-shadow: inset 0 -3px 0 var(--cyan-edge); }
  .st.active[data-state="completed"], .st.active[data-state="finished"] { background: var(--green); color: var(--ink); box-shadow: inset 0 -3px 0 var(--green-edge); }
  .st.active[data-state="rewatched"] { background: var(--blue); color: var(--ink); box-shadow: inset 0 -3px 0 var(--blue-edge); }

  /* === PROGRESS === */
  .prog { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .prog-btn {
    font-family: var(--px); font-size: calc(14px * var(--fs)); min-width: 44px; height: 44px; padding: 0 10px;
    background: var(--bg); color: var(--muted); box-shadow: inset 0 -3px 0 var(--well-edge);
  }
  .prog-btn.plus { background: var(--cyan); color: var(--ink); box-shadow: inset 0 -3px 0 var(--cyan-edge); flex: 1; }
  .prog-num {
    font-family: var(--px); font-size: calc(14px * var(--fs)); color: var(--t-cyan); min-width: 96px; min-height: 44px;
    text-align: center; text-decoration: underline dotted; text-underline-offset: 4px;
  }
  .prog-bar { height: 4px; background: var(--bg); margin-top: 8px; }
  .prog-bar i { display: block; height: 100%; background: var(--cyan); }

  /* === DELETE (two-tap) === */
  .del {
    font-family: var(--px); font-size: calc(11px * var(--fs)); flex-shrink: 0;
    min-width: 52px; height: 36px; padding: 0 8px;
    background: var(--bg); color: var(--muted); box-shadow: inset 0 -3px 0 var(--well-edge);
  }
  .del.arm { background: var(--red); color: #F4F4F4; box-shadow: inset 0 -3px 0 var(--red-edge); }

  /* === ADD FORMS === */
  .add-form { display: flex; gap: 8px; margin-bottom: 16px; }
  .add-input {
    flex: 1; min-width: 0; width: 100%; background: var(--bg); border: 3px solid var(--panel);
    padding: 12px; font-size: calc(16px * var(--fs)); border-radius: 0; -webkit-appearance: none;
  }
  .add-input:focus { outline: none; border-color: var(--accent); }
  .add-input::placeholder { color: var(--panel-hi); }
  .add-btn {
    font-family: var(--px); font-size: calc(13px * var(--fs)); background: var(--accent); color: var(--ink);
    padding: 0 16px; min-height: 50px; box-shadow: inset 0 -4px 0 var(--accent-edge); flex-shrink: 0;
  }
  .add-toggle { width: 100%; margin-bottom: 12px; }
  .ghost-btn {
    font-family: var(--px); font-size: calc(12px * var(--fs)); background: var(--bg); color: var(--muted);
    padding: 0 16px; min-height: 50px; box-shadow: inset 0 -3px 0 var(--well-edge);
  }
  .add-btn:active, .chip:active, .st:active, .tab:active, .prog-btn:active, .del:active, .check:active, .ghost-btn:active { transform: translateY(2px); }

  .big-form { display: none; background: var(--panel); box-shadow: inset 0 -4px 0 var(--panel-edge); padding: 14px 14px 18px; margin-bottom: 16px; }
  .big-form.open { display: block; }
  .field-label { font-family: var(--px); font-size: calc(11px * var(--fs)); color: var(--muted); margin: 12px 0 6px; display: block; }
  .field-label:first-child { margin-top: 0; }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; font-family: var(--px); font-size: calc(12px * var(--fs)); min-height: 44px;
    background: var(--bg); color: var(--muted); box-shadow: inset 0 -3px 0 var(--well-edge);
  }
  .seg button.on { background: var(--accent); color: var(--ink); box-shadow: inset 0 -3px 0 var(--accent-edge); }
  .form-actions { display: flex; gap: 8px; margin-top: 16px; }
  .form-actions .add-btn { flex: 1; }
  .form-err { font-family: var(--px); font-size: calc(11px * var(--fs)); color: var(--t-orange); margin-top: 8px; min-height: 14px; }

  /* === BOOK SEARCH === */
  .suggest { margin-top: 6px; }
  .suggest-status { font-family: var(--px); font-size: calc(11px * var(--fs)); color: var(--muted); padding: 6px 0; }
  .sug {
    display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
    background: var(--bg); padding: 8px; margin-bottom: 4px; min-height: 64px;
    box-shadow: inset 0 -3px 0 var(--well-edge);
  }
  .sug:active { transform: translateY(2px); }
  .sug img, .sug .no-cover { width: 34px; height: 50px; object-fit: cover; flex-shrink: 0; background: var(--panel); }
  .sug-title { font-size: calc(15px * var(--fs)); font-weight: 600; line-height: 1.2; }
  .sug-meta { font-size: calc(13px * var(--fs)); color: var(--muted); margin-top: 2px; }
  .picked { display: flex; gap: 10px; align-items: center; margin-top: 8px; font-family: var(--px); font-size: calc(11px * var(--fs)); color: var(--t-green); }
  .picked img { width: 34px; height: 50px; object-fit: cover; }
  .cover { width: 48px; height: 72px; object-fit: cover; flex-shrink: 0; background: var(--bg); }

  /* === LIST ITEMS (to-do + notes) === */
  .list-label { font-family: var(--px); font-size: calc(11px * var(--fs)); color: var(--muted); margin: 20px 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .item {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); box-shadow: inset 0 -4px 0 var(--panel-edge);
    padding: 8px 8px 12px; margin-bottom: 6px;
  }
  .check {
    width: 44px; height: 44px; flex-shrink: 0; background: var(--bg); color: var(--t-green);
    display: flex; align-items: center; justify-content: center; box-shadow: inset 0 -3px 0 var(--well-edge);
  }
  .check svg { width: 20px; height: 20px; visibility: hidden; }
  .item.done .check { background: var(--green); color: var(--ink); box-shadow: inset 0 -3px 0 var(--green-edge); }
  .item.done .check svg { visibility: visible; }
  .item-text { flex: 1; min-width: 0; font-size: calc(16px * var(--fs)); overflow-wrap: anywhere; }
  .item.done .item-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--t-green); }
  .item-date { font-family: var(--px); font-size: calc(11px * var(--fs)); color: var(--muted); flex-shrink: 0; }
  .note-item { padding-left: 14px; }

  .text-btn { font-family: var(--px); font-size: calc(11px * var(--fs)); color: var(--muted); padding: 8px 0; min-height: 36px; }
  .text-btn.danger { color: var(--t-red); }
  .empty { font-family: var(--px); font-size: calc(12px * var(--fs)); color: var(--panel-hi); text-align: center; padding: 28px 0; }

  /* === DATA FOOTER === */
  .data { margin-top: 40px; padding-top: 16px; border-top: 4px solid var(--panel); display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; }
  .data .saved { font-family: var(--px); font-size: calc(11px * var(--fs)); color: var(--panel-hi); width: 100%; }

  /* === TABS === */
  .panel { display: none; }
  .panel.active { display: block; }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
    border-top: 4px solid var(--panel);
    padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px); z-index: 10;
  }
  .tabbar-inner { max-width: 640px; margin: 0 auto; display: flex; gap: 6px; }
  .tab {
    flex: 1; min-width: 0; font-family: var(--px); font-size: calc(11px * var(--fs)); min-height: 48px; padding: 0 1px;
    background: var(--panel); color: var(--muted); box-shadow: inset 0 -4px 0 var(--panel-edge);
  }
  .tab.active { background: var(--accent); color: var(--ink); box-shadow: inset 0 -4px 0 var(--accent-edge); }
  .tab .n { font-size: calc(10px * var(--fs)); opacity: .8; margin-left: 3px; }
</style>

  // Storage keys. Do not rename: existing data lives under these.
  const STATE_KEY = 'watchlist:state';        // show status by id

  const SHOW_STATUSES = ['not-started', 'watching', 'completed', 'rewatched'];
  const BOOK_STATUSES = ['want', 'reading', 'finished'];

  let shows = [], books = [], games = [], state = {}, progress = {}, notes = [], todos = [], cats = DEFAULT_CATS.slice();
  let todoCat = 'all', catEdit = false;
  const openTasks = new Set();
  const filters = { show: 'all', book: 'all', game: 'all' };
  const formChoice = { show: { type: 'anime' }, book: { format: 'physical' }, game: { platform: 'PC' } };

  // ===== HELPERS =====
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const isArr = v => Array.isArray(v);

  function load(key, fallback, check) {
    try {
      const raw = localStorage.getItem(key);
      if (raw === null) return fallback;
      const parsed = JSON.parse(raw);
      return check(parsed) ? parsed : fallback;
    } catch (e) {
      console.warn('Could not load ' + key + ':', e.message);
      return fallback;
    }
  }
  function save(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      document.getElementById('sync-time').textContent =
        new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      if (typeof onLocalChange === 'function') onLocalChange(key);
    } catch (e) {
      console.warn('Could not save ' + key + ':', e.message);
    }
  }
  const uid = p => p + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
  const esc = str => String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  function shortDate(ts) {
    const d = new Date(ts);
    const opts = d.getFullYear() === new Date().getFullYear()
      ? { month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric', year: '2-digit' };
    return d.toLocaleDateString([], opts);
  }
  const toInt = v => { const n = parseInt(v, 10); return isNaN(n) ? null : n; };

  const ICONS = {
    box:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" shape-rendering="crispEdges"><rect x="5" y="5" width="14" height="14"/></svg>',

    check: '<svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges"><path d="M19 6h3v3h-3v3h-3v3h-3v3h-3v3H7v-3H4v-3H1v-3h3v3h3v3h3v-3h3v-3h3V9h3z"/></svg>',
    star:  '<svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges"><path d="M10 2h4v6h8v4h-3v2h-2v3h2v5h-3v-2h-2v-2h-4v2H7v2H4v-5h2v-3H4v-2H2V8h8z"/></svg>',

  };
  const SHOW_BTNS = [
    ['not-started', ICONS.box, 'Not started'], ['watching', ICONS.play, 'Watching'],
    ['completed', ICONS.check, 'Done'], ['rewatched', ICONS.again, 'Rewatched']
  ];
  const BOOK_BTNS = [
    ['want', ICONS.box, 'Up next'], ['reading', ICONS.play, 'Reading'], ['finished', ICONS.check, 'Finished']
  ];

  function section(cls, label, items, renderFn) {
    if (!items.length) return '';
    return `
      <div class="section-head ${cls}">
        <span class="big">${label}</span><span class="rule"></span>
        <span class="count">${items.length}</span>
      </div>
      ${items.map(renderFn).join('')}`;
  }

  // ===== TABS =====
  const TAB_NAMES = { todo: 'TO-DO', shows: 'SHOWS', books: 'BOOKS', games: 'GAMES', notes: 'NOTES', settings: 'SETTINGS', search: 'SEARCH' };
  function setTab(name) {
    if (!TAB_NAMES[name]) name = 'todo';
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.getElementById('gear').classList.toggle('on', name === 'settings');
    document.getElementById('search-btn').classList.toggle('on', name === 'search');
    if (name !== 'settings' && name !== 'search') lastTab = name;
    window.scrollTo(0, 0);
  }
  let lastTab = 'todo';
  document.getElementById('gear').addEventListener('click', () => {
    setTab(document.getElementById('panel-settings').classList.contains('active') ? lastTab : 'settings');
  });
  document.getElementById('search-btn').addEventListener('click', () => {
    if (document.getElementById('panel-search').classList.contains('active')) { setTab(lastTab); return; }
    setTab('search');
    const inp = document.getElementById('search-input');
    inp.value = '';
    renderSearch();
    inp.focus();
  });
  document.querySelector('.tabbar').addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (t) setTab(t.dataset.tab);
  });

  // ===== TWO-TAP DELETE =====
  // First tap arms the button ("SURE?"), second tap within 3s deletes.
  let armed = null, armTimer = null;
  function disarm() {
    if (armed) { armed.classList.remove('arm'); armed.textContent = 'DEL'; }
    armed = null;
    clearTimeout(armTimer);
  }
  document.addEventListener('click', e => {
    const btn = e.target.closest('.del');
    if (!btn) { disarm(); return; }
    e.stopPropagation();
    if (armed !== btn) {
      disarm();
      armed = btn;
      btn.classList.add('arm');
      btn.textContent = 'SURE?';
      armTimer = setTimeout(disarm, 3000);
      return;
    }
    const [kind, id] = btn.dataset.del.split('|');
    disarm();
    ({ show: deleteShow, book: deleteBook, game: deleteGame, gtask: deleteGameTask, todo: deleteTodo, note: deleteNote })[kind](id);
  }, true);
  const delBtn = (kind, id) => `<button class="del" type="button" data-del="${kind}|${esc(id)}" aria-label="Delete">DEL</button>`;

  // ===== ADD FORMS =====
  function toggleForm(kind, force) {
    const form = document.getElementById(kind + '-form');
    const open = typeof force === 'boolean' ? force : !form.classList.contains('open');
    form.classList.toggle('open', open);
    document.getElementById(kind + '-toggle').style.display = open ? 'none' : '';
    document.getElementById(kind + '-err').textContent = '';
    if (open) document.getElementById(kind + '-title').focus();
  }
  document.querySelectorAll('.seg[data-form]').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    formChoice[seg.dataset.form][seg.dataset.field] = b.dataset.v;
    if (seg.dataset.form === 'show' && window.lookups) lookups.show.rerun();
    if (seg.dataset.form === 'book') {
      document.getElementById('book-pages-wrap').style.display = b.dataset.v === 'physical' ? '' : 'none';
    }
  }));
  ['show', 'book', 'game'].forEach(k => document.getElementById(k + '-title').addEventListener('input', () => {
    document.getElementById(k + '-err').textContent = '';
  }));

  document.querySelectorAll('[data-chips]').forEach(row => row.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    row.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
    filters[row.dataset.chips] = chip.dataset.filter;
    ({ show: renderShows, book: renderBooks, game: renderGames })[row.dataset.chips]();
  }));

  // ===== SHOWS =====
  const showStatus = id => SHOW_STATUSES.includes(state[id]) ? state[id] : 'not-started';
  const showProg = id => Math.max(0, toInt(progress[id]) || 0);
  const showDone = s => ['completed', 'rewatched'].includes(showStatus(s.id));
  const findShow = id => shows.find(s => s.id === id);

  // Overall episode number -> { season, ep, len } using the per-season episode counts.
  function seasonOf(s, n) {
    if (!isArr(s.seasons) || s.seasons.length < 2) return null;
    let left = n;
    for (let i = 0; i < s.seasons.length; i++) {
      const len = s.seasons[i];
      if (left <= len || i === s.seasons.length - 1) return { season: i + 1, ep: Math.max(0, left), len };
      left -= len;
    }
    return null;
  }
  function epLabel(s, n) {
    const p = seasonOf(s, n);
    if (p) return `S${p.season} E${p.ep} / ${p.len}`;
    return s.episodes ? `EP ${n} / ${s.episodes}` : `EP ${n}`;
  }

  function showHoursLeft(s) {
    if (showDone(s)) return 0;
    if (!s.episodes) return s.hours || 0;
    return (s.hours || 0) * Math.max(0, s.episodes - showProg(s.id)) / s.episodes;
  }

  function renderShows() {
    const f = filters.show;
    const list = shows.filter(s => f === 'all' || s.type === f);
    const html =
      section('sec-active', 'Watching', list.filter(s => showStatus(s.id) === 'watching'), showCard) +
      section('sec-next', 'Up next', list.filter(s => showStatus(s.id) === 'not-started'), showCard) +
      section('sec-done', 'Done', list.filter(showDone), showCard);
    document.getElementById('shows-list').innerHTML = html || '<div class="empty">No shows</div>';

    document.getElementById('sh-watching').textContent = shows.filter(s => showStatus(s.id) === 'watching').length;
    document.getElementById('sh-next').textContent = shows.filter(s => showStatus(s.id) === 'not-started').length;
    document.getElementById('sh-done').textContent = shows.filter(showDone).length;
    document.getElementById('sh-hours').textContent = Math.round(shows.reduce((a, s) => a + showHoursLeft(s), 0));
  }

  function showCard(s) {
    const st = showStatus(s.id);
    const n = showProg(s.id);
    const prog = st !== 'watching' ? '' : `
      <div class="prog">
        <button class="prog-btn" data-act="ep" data-step="-1" aria-label="Back one episode">-1</button>
        <button class="prog-num" data-act="ep-set" aria-label="Set episode">${epLabel(s, n)}</button>
        <button class="prog-btn plus" data-act="ep" data-step="1" aria-label="Watched one more episode">+1 EP</button>
      </div>
      ${s.episodes ? `<div class="prog-bar"><i style="width:${Math.min(100, Math.round(n / s.episodes * 100))}%"></i></div>` : ''}`;
    return `
      <div class="card ${st} ${showDone(s) ? 'is-done' : ''}" data-id="${esc(s.id)}">
        <div class="card-top">
          ${safeCover(s.image) ? `<img class="cover" src="${esc(s.image)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
          <div class="card-main">
            <div class="tags">
              <span class="tag ${s.type}">${s.type === 'anime' ? 'Anime' : 'Live-action'}</span>
              ${s.airing ? '<span class="tag airing">Airing</span>' : ''}
            </div>
            <div class="card-title">${esc(s.title)}</div>
          </div>
          ${delBtn('show', s.id)}
        </div>
        ${prog}
        <div class="card-foot">
          <span class="card-len">${isArr(s.seasons) && s.seasons.length > 1 ? `<span>${s.seasons.length}</span> SEASONS · ` : ''}${s.episodes ? `<span>${s.episodes}</span> EP` : '? EP'}${s.hours ? ` · ~${Math.round(s.hours)}H` : ''}</span>
          <div class="status">
            ${SHOW_BTNS.map(([v, icon, label]) =>
              `<button class="st ${st === v ? 'active' : ''}" data-act="status" data-state="${v}" aria-label="${label}">${icon}</button>`).join('')}
          </div>
        </div>
      </div>`;
  }

  document.getElementById('shows-list').addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const id = btn.closest('.card').dataset.id;
    const s = findShow(id);
    if (!s) return;
    const act = btn.dataset.act;
    if (act === 'status') {
      state[id] = btn.dataset.state;
      save(STATE_KEY, state);
    } else if (act === 'ep' || act === 'ep-set') {
      let n;
      if (act === 'ep') n = showProg(id) + toInt(btn.dataset.step);
      else {
        const cur = seasonOf(s, showProg(id));
        if (cur) {
          const sv = prompt(`Season (1-${s.seasons.length})`, cur.season);
          if (sv === null || toInt(sv) === null) return;
          const sn = Math.min(Math.max(1, toInt(sv)), s.seasons.length);
          const ev = prompt(`Episode in season ${sn} (0-${s.seasons[sn - 1]})`, sn === cur.season ? cur.ep : 0);
          if (ev === null || toInt(ev) === null) return;
          const before = s.seasons.slice(0, sn - 1).reduce((a, x) => a + x, 0);
          n = before + Math.min(Math.max(0, toInt(ev)), s.seasons[sn - 1]);
        } else {
          const v = prompt('Episode you are on', showProg(id));
          if (v === null || toInt(v) === null) return;
          n = toInt(v);
        }
      }
      n = Math.max(0, s.episodes ? Math.min(n, s.episodes) : n);
      progress[id] = n;
      save(PROGRESS_KEY, progress);
      if (s.episodes && n === s.episodes) { state[id] = 'completed'; save(STATE_KEY, state); }
    }
    renderShows();
  });

  function addShow(e) {
    e.preventDefault();
    const titleEl = document.getElementById('show-title');
    const epsEl = document.getElementById('show-eps');
    const err = document.getElementById('show-err');
    const title = titleEl.value.trim();
    if (!title) { err.textContent = 'Enter a name'; return false; }
    if (shows.some(s => s.title.toLowerCase() === title.toLowerCase())) { err.textContent = 'Already on the list'; return false; }
    const eps = toInt(epsEl.value);
    const episodes = eps > 0 ? Math.min(eps, 5000) : null;
    const type = formChoice.show.type;
    const pick = lookups.show.picked && lookups.show.picked.title === title ? lookups.show.picked : null;
    const minsPerEp = (pick && pick.minutes) || (type === 'anime' ? 24 : 45);
    shows.unshift({
      id: uid('show'), title, type, episodes,
      hours: episodes ? Math.round(episodes * minsPerEp / 60) : 0,
      image: pick ? safeCover(pick.image) : null,
      airing: !!(pick && pick.airing),
      seasons: pick && pick.seasons && episodes === pick.episodes ? pick.seasons : null,
      added: Date.now()
    });
    save(SHOWS_KEY, shows);
    titleEl.value = ''; epsEl.value = '';
    lookups.show.clear();
    toggleForm('show', false);
    renderShows();
    return false;
  }

  function deleteShow(id) {
    shows = shows.filter(s => s.id !== id);
    delete state[id];
    delete progress[id];
    save(SHOWS_KEY, shows); save(STATE_KEY, state); save(PROGRESS_KEY, progress);
    renderShows();
  }

  // ===== BOOKS =====
  const bookStatus = b => BOOK_STATUSES.includes(b.status) ? b.status : 'want';
  const findBook = id => books.find(b => b.id === id);

  function bookProgLabel(b) {
    const n = b.current || 0;
    if (b.format === 'audio') return n + '%';
    return b.total ? `PG ${n} / ${b.total}` : `PG ${n}`;
  }
  function bookPct(b) {
    if (b.format === 'audio') return Math.min(100, b.current || 0);
    return b.total ? Math.min(100, Math.round((b.current || 0) / b.total * 100)) : 0;
  }

  function renderBooks() {
    const f = filters.book;
    const list = books.filter(b => f === 'all' || b.format === f);
    const finished = list.filter(b => bookStatus(b) === 'finished')
      .sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));
    const html =
      section('sec-active', 'Reading', list.filter(b => bookStatus(b) === 'reading'), bookCard) +
      section('sec-next', 'Up next', list.filter(b => bookStatus(b) === 'want'), bookCard) +
      section('sec-done', 'Finished', finished, bookCard);
    document.getElementById('books-list').innerHTML = html || '<div class="empty">No books yet</div>';

    const year = new Date().getFullYear();
    document.getElementById('bk-reading').textContent = books.filter(b => bookStatus(b) === 'reading').length;
    document.getElementById('bk-next').textContent = books.filter(b => bookStatus(b) === 'want').length;
    document.getElementById('bk-done').textContent = books.filter(b => bookStatus(b) === 'finished').length;
    document.getElementById('bk-year-label').textContent = 'Read in ' + year;
    document.getElementById('bk-year').textContent = books.filter(b =>
      bookStatus(b) === 'finished' && b.finishedAt && new Date(b.finishedAt).getFullYear() === year).length;
  }

  function bookCard(b) {
    const st = bookStatus(b);
    const audio = b.format === 'audio';
    const showBar = audio || b.total;
    const prog = st !== 'reading' ? '' : `
      <div class="prog">
        <button class="prog-num" data-act="set" aria-label="Set progress">${bookProgLabel(b)}</button>
        <button class="prog-btn plus" data-act="step" aria-label="Add progress">${audio ? '+5%' : '+10 PG'}</button>
      </div>
      ${showBar ? `<div class="prog-bar"><i style="width:${bookPct(b)}%"></i></div>` : ''}`;
    return `
      <div class="card ${st === 'finished' ? 'is-done' : ''}" data-id="${esc(b.id)}">
        <div class="card-top">
          ${safeCover(b.cover) ? `<img class="cover" src="${esc(b.cover)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
          <div class="card-main">
            <div class="tags">
              <span class="tag ${b.format}">${audio ? 'Audiobook' : 'Physical'}</span>
              ${st === 'finished' && b.finishedAt ? `<span class="tag">${shortDate(b.finishedAt)}</span>` : ''}
            </div>
            <div class="card-title">${esc(b.title)}</div>
            ${b.author ? `<div class="card-sub">${esc(b.author)}</div>` : ''}
          </div>
          ${delBtn('book', b.id)}
        </div>
        ${prog}
        <div class="card-foot">
          <span class="card-len">${!audio && b.total ? `<span>${b.total}</span> PG` : ''}</span>
          <div class="status">
            ${BOOK_BTNS.map(([v, icon, label]) =>
              `<button class="st ${st === v ? 'active' : ''}" data-act="status" data-state="${v}" aria-label="${label}">${icon}</button>`).join('')}
          </div>
        </div>
      </div>`;
  }

  function setBookStatus(b, st) {
    if (b.status !== 'finished' && st === 'finished') b.finishedAt = Date.now();
    if (st !== 'finished') b.finishedAt = null;
    if (st === 'finished') b.current = b.format === 'audio' ? 100 : (b.total || b.current || 0);
    b.status = st;
  }

  document.getElementById('books-list').addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const b = findBook(btn.closest('.card').dataset.id);
    if (!b) return;
    const act = btn.dataset.act;
    const max = b.format === 'audio' ? 100 : (b.total || Infinity);
    if (act === 'status') {
      setBookStatus(b, btn.dataset.state);
    } else {
      let n;
      if (act === 'step') n = (b.current || 0) + (b.format === 'audio' ? 5 : 10);
      else {
        const v = prompt(b.format === 'audio' ? 'Percent listened (0-100)' : 'Page you are on', b.current || 0);
        if (v === null || toInt(v) === null) return;
        n = toInt(v);
      }
      b.current = Math.max(0, Math.min(n, max));
      if (b.current === max) setBookStatus(b, 'finished');
    }
    save(BOOKS_KEY, books);
    renderBooks();
  });

  function addBook(e) {
    e.preventDefault();
    const titleEl = document.getElementById('book-title');
    const authorEl = document.getElementById('book-author');
    const pagesEl = document.getElementById('book-pages');
    const err = document.getElementById('book-err');
    const title = titleEl.value.trim();
    if (!title) { err.textContent = 'Enter a title'; return false; }
    const format = formChoice.book.format;
    if (books.some(b => b.title.toLowerCase() === title.toLowerCase() && b.format === format)) {
      err.textContent = 'Already on the list'; return false;
    }
    const pages = toInt(pagesEl.value);
    books.unshift({
      id: uid('book'), title, author: authorEl.value.trim(), format,
      status: 'want', current: 0,
      total: format === 'physical' && pages > 0 ? Math.min(pages, 10000) : null,
      cover: picked && picked.title === title ? safeCover(picked.cover) : null,
      added: Date.now(), finishedAt: null
    });
    save(BOOKS_KEY, books);
    titleEl.value = ''; authorEl.value = ''; pagesEl.value = '';
    clearPick();
    toggleForm('book', false);
    renderBooks();
    return false;
  }

  function deleteBook(id) {
    books = books.filter(b => b.id !== id);
    save(BOOKS_KEY, books);
    renderBooks();
  }

  // ===== BOOK SEARCH (Google Books, Open Library fallback) =====
  // Both are free and need no key. Results only fill the form; nothing is sent anywhere else.
  let picked = null, searchTimer = null, searchCtl = null, lastQuery = '';

  function safeCover(url) {
    return typeof url === 'string' && /^https:\/\/(books\.google\.com|books\.googleusercontent\.com|covers\.openlibrary\.org|static\.tvmaze\.com|s4\.anilist\.co|media\.rawg\.io)\//.test(url) ? url : null;
  }

  async function searchGoogle(q, signal) {
    const url = 'https://www.googleapis.com/books/v1/volumes?maxResults=6&printType=books&q=' + encodeURIComponent(q) +
      '&fields=items(volumeInfo(title,subtitle,authors,pageCount,publishedDate,imageLinks/thumbnail))';
    const res = await fetch(url, { signal });
    if (!res.ok) throw new Error('google ' + res.status);
    const data = await res.json();
    return (data.items || []).map(it => {
      const v = it.volumeInfo || {};
      const thumb = v.imageLinks && v.imageLinks.thumbnail;
      return {
        title: v.title || '',
        author: (v.authors || []).join(', '),
        pages: v.pageCount || null,
        year: (v.publishedDate || '').slice(0, 4),
        cover: thumb ? thumb.replace(/^http:/, 'https:').replace('&edge=curl', '') : null
      };
    }).filter(r => r.title);
  }

  async function searchOpenLibrary(q, signal) {
    const url = 'https://openlibrary.org/search.json?limit=6&fields=title,author_name,number_of_pages_median,cover_i,first_publish_year&q=' + encodeURIComponent(q);
    const res = await fetch(url, { signal });
    if (!res.ok) throw new Error('openlibrary ' + res.status);
    const data = await res.json();
    return (data.docs || []).map(d => ({
      title: d.title || '',
      author: (d.author_name || []).slice(0, 2).join(', '),
      pages: d.number_of_pages_median || null,
      year: d.first_publish_year ? String(d.first_publish_year) : '',
      cover: d.cover_i ? 'https://covers.openlibrary.org/b/id/' + d.cover_i + '-M.jpg' : null
    })).filter(r => r.title);
  }

  let lastResults = [];
  async function runSearch(q) {
    const box = document.getElementById('book-suggest');
    if (searchCtl) searchCtl.abort();
    searchCtl = new AbortController();
    const signal = searchCtl.signal;
    box.innerHTML = '<div class="suggest-status">Searching…</div>';
    let results = null;
    const fails = [];
    try { results = await searchGoogle(q, signal); }
    catch (e) {
      if (e.name === 'AbortError') return;
      fails.push('Google: ' + e.message);
    }
    if (!results || !results.length) {
      try { results = await searchOpenLibrary(q, signal); }
      catch (e) {
        if (e.name === 'AbortError') return;
        fails.push('Open Library: ' + e.message);
        if (!results) {
          if (q !== lastQuery) return;
          box.innerHTML = '<div class="suggest-status">Search failed. Type it in.<br>' + esc(fails.join(' / ')) + '</div>';
          return;
        }
      }
    }
    if (q !== lastQuery) return;
    lastResults = results || [];
    box.innerHTML = lastResults.length ? lastResults.map((r, i) => `
      <button type="button" class="sug" data-i="${i}">
        ${safeCover(r.cover) ? `<img src="${esc(r.cover)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'no-cover'}))">` : '<span class="no-cover"></span>'}
        <span>
          <div class="sug-title">${esc(r.title)}</div>
          <div class="sug-meta">${esc([r.author, r.year, r.pages ? r.pages + ' pg' : ''].filter(Boolean).join(' · '))}</div>
        </span>
      </button>`).join('') : '<div class="suggest-status">No matches. Type it in.</div>';
  }

  document.getElementById('book-suggest').addEventListener('click', e => {
    const b = e.target.closest('.sug');
    if (!b) return;
    const r = lastResults[toInt(b.dataset.i)];
    if (!r) return;
    picked = r;
    document.getElementById('book-title').value = r.title;
    document.getElementById('book-author').value = r.author;
    document.getElementById('book-pages').value = r.pages || '';
    document.getElementById('book-suggest').innerHTML = '';
    document.getElementById('book-picked').innerHTML = `
      <div class="picked">${safeCover(r.cover) ? `<img src="${esc(r.cover)}" alt="" onerror="this.remove()">` : ''}<span>Filled in. Pick format, then save.</span></div>`;
    document.getElementById('book-err').textContent = '';
  });

  document.getElementById('book-title').addEventListener('input', e => {
    const q = e.target.value.trim();
    if (picked && picked.title !== e.target.value) { picked = null; document.getElementById('book-picked').innerHTML = ''; }
    clearTimeout(searchTimer);
    lastQuery = q;
    if (q.length < 3) {
      if (searchCtl) searchCtl.abort();
      document.getElementById('book-suggest').innerHTML = '';
      return;
    }
    searchTimer = setTimeout(() => runSearch(q), 450);
  });

  function clearPick() {
    picked = null;
    clearTimeout(searchTimer);
    if (searchCtl) searchCtl.abort();
    document.getElementById('book-suggest').innerHTML = '';
    document.getElementById('book-picked').innerHTML = '';
  }

  // ===== LOOKUP (shows + games) =====
  // Generic search-as-you-type: search(q, signal) -> [{ title, meta, image, wide, ... }], onPick(result) fills the form.
  function makeLookup({ kind, search, onPick, minLen = 2 }) {
    const input = document.getElementById(kind + '-title');
    const box = document.getElementById(kind + '-suggest');
    const pickedBox = document.getElementById(kind + '-picked');
    const L = { picked: null, results: [], timer: null, ctl: null, q: '' };
    async function run(q) {
      if (L.ctl) L.ctl.abort();
      L.ctl = new AbortController();
      box.innerHTML = '<div class="suggest-status">Searching…</div>';
      try {
        const res = await search(q, L.ctl.signal);
        if (q !== L.q) return;
        L.results = res;
        box.innerHTML = res.length ? res.map((r, i) => `
          <button type="button" class="sug" data-i="${i}">
            ${safeCover(r.image) ? `<img src="${esc(r.image)}" alt="" style="${r.wide ? 'width:72px;height:41px' : ''}" onerror="this.remove()">` : '<span class="no-cover"></span>'}
            <span><div class="sug-title">${esc(r.title)}</div><div class="sug-meta">${esc(r.meta || '')}</div></span>
          </button>`).join('') : '<div class="suggest-status">No matches. Type it in.</div>';
      } catch (e) {
        if (e.name === 'AbortError' || q !== L.q) return;
        box.innerHTML = '<div class="suggest-status">Search failed. Type it in.<br>' + esc(e.message) + '</div>';
      }
    }
    input.addEventListener('input', () => {
      const v = input.value;
      if (L.picked && L.picked.title !== v) { L.picked = null; pickedBox.innerHTML = ''; }
      clearTimeout(L.timer);
      L.q = v.trim();
      if (L.q.length < minLen) { if (L.ctl) L.ctl.abort(); box.innerHTML = ''; return; }
      L.timer = setTimeout(() => run(L.q), 450);
    });
    box.addEventListener('click', async e => {
      const b = e.target.closest('.sug');
      if (!b) return;
      const r = L.results[toInt(b.dataset.i)];
      if (!r) return;
      box.innerHTML = '<div class="suggest-status">Loading details…</div>';
      let full = r;
      try { full = await onPick(r) || r; } catch (err) { full = Object.assign({}, r, { warn: 'Details failed: ' + err.message }); }
      L.picked = full;
      input.value = full.title;
      box.innerHTML = '';
      pickedBox.innerHTML = `<div class="picked">${safeCover(full.image) ? `<img src="${esc(full.image)}" alt="" style="${full.wide ? 'width:72px;height:41px' : ''}" onerror="this.remove()">` : ''}<span>${full.warn ? esc(full.warn) + '. Check the episodes, then save.' : (isArr(full.seasons) ? full.seasons.length + ' seasons, ' + full.episodes + ' episodes. Save when ready.' : 'Filled in. Check it, then save.')}</span></div>`;
    });
    L.clear = () => {
      L.picked = null; L.q = ''; clearTimeout(L.timer); if (L.ctl) L.ctl.abort();
      box.innerHTML = ''; pickedBox.innerHTML = '';
    };
    L.rerun = () => { if (L.q.length >= minLen && !L.picked) run(L.q); };
    return L;
  }

  const stripYear = d => (d || '').slice(0, 4);

  async function searchTvmaze(q, signal) {
    const res = await fetch('https://api.tvmaze.com/search/shows?q=' + encodeURIComponent(q), { signal });
    if (!res.ok) throw new Error('TVmaze ' + res.status);
    const data = await res.json();
    return data.slice(0, 6).map(({ show: s }) => ({
      src: 'tvmaze', id: s.id, title: s.name,
      image: s.image && s.image.medium ? s.image.medium.replace(/^http:/, 'https:') : null,
      minutes: s.averageRuntime || s.runtime || null,
      airing: s.status === 'Running',
      meta: [stripYear(s.premiered), s.network ? s.network.name : (s.webChannel ? s.webChannel.name : ''), s.status].filter(Boolean).join(' · ')
    }));
  }

  const SEASON_FORMATS = ['TV', 'TV_SHORT', 'ONA'];
  const aniTitle = m => (m.title && (m.title.english || m.title.romaji)) || '';
  // AniList links real seasons AND separate series (Naruto -> Shippuden -> Boruto) the same way,
  // so only treat an entry as a later season when its title says it is one.
  const SEASON_RE = /\b(season\s*\d+|\d+(st|nd|rd|th)\s+season|(second|third|fourth|fifth|sixth|seventh|final)\s+season|part\s*\d+|cour\s*\d+|arc)\s*$|\bseason\s*\d+\b|\b(second|third|fourth|fifth|final)\s+season\b|\bpart\s*(\d+|ii|iii)\b|\s(ii|iii|iv|v|vi)$|\barc\b|-hen\b|\bcour\b|\sr2$/i;
  const isLaterSeason = m => {
    const t = m.title || {};
    return [t.english, t.romaji].filter(Boolean).some(x => SEASON_RE.test(x.trim()));
  };

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function anilist(query, variables, signal, tries = 2) {
    const res = await fetch('https://graphql.anilist.co', {
      method: 'POST', signal,
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ query, variables })
    });
    if (res.status === 429 && tries > 0) {
      const wait = Math.min(8, toInt(res.headers.get('Retry-After')) || 3);
      await sleep(wait * 1000);
      return anilist(query, variables, signal, tries - 1);
    }
    if (res.status === 429) throw new Error('AniList busy (rate limit)');
    if (!res.ok) throw new Error('AniList ' + res.status);
    const data = await res.json();
    if (data.errors && data.errors.length) throw new Error(data.errors[0].message);
    return data.data;
  }

  async function searchAnilist(q, signal) {
    const data = await anilist(`query ($s: String) { Page(perPage: 10) { media(search: $s, type: ANIME, sort: SEARCH_MATCH) {
      id title { english romaji } episodes duration status seasonYear format coverImage { medium }
      relations { edges { relationType node { id type format } } } } } }`, { s: q }, signal);
    const list = (data && data.Page && data.Page.media) || [];
    const ids = new Set(list.map(m => m.id));
    // A later season points back to an earlier one with a PREQUEL relation. If that earlier
    // season is also in the results, hide the later one: picking the show pulls in every season.
    const prequelOf = m => isLaterSeason(m) && ((m.relations && m.relations.edges) || [])
      .find(e => e.relationType === 'PREQUEL' && e.node.type === 'ANIME' && SEASON_FORMATS.includes(e.node.format));
    return list.filter(m => {
      const pre = prequelOf(m);
      return !(pre && ids.has(pre.node.id) && SEASON_FORMATS.includes(m.format));
    }).slice(0, 6).map(m => ({
      src: 'anilist', id: m.id, title: aniTitle(m), format: m.format,
      image: m.coverImage && m.coverImage.medium,
      episodes: m.episodes || null, minutes: m.duration || null,
      airing: m.status === 'RELEASING',
      meta: [m.seasonYear, m.format, prequelOf(m) ? 'later season, picks up all seasons' : ''].filter(Boolean).join(' · ')
    })).filter(r => r.title);
  }

  // Walk the PREQUEL chain back to season 1, then the SEQUEL chain forward, collecting TV seasons.
  async function anilistSeasons(startId) {
    const Q = `query ($id: Int) { Media(id: $id, type: ANIME) {
      id title { english romaji } episodes duration status format coverImage { medium }
      relations { edges { relationType node { id type format } } } } }`;
    const cache = {};
    const get = async id => {
      if (cache[id]) return cache[id];
      if (Object.keys(cache).length) await sleep(250);
      const d = await anilist(Q, { id });
      if (!d || !d.Media) throw new Error('AniList returned no data for ' + id);
      return (cache[id] = d.Media);
    };
    const nextOf = (m, rel) => ((m.relations && m.relations.edges) || [])
      .find(e => e.relationType === rel && e.node.type === 'ANIME' && SEASON_FORMATS.includes(e.node.format));
    let root = await get(startId);
    for (let i = 0; i < 12 && isLaterSeason(root); i++) {
      const pre = nextOf(root, 'PREQUEL');
      if (!pre) break;
      root = await get(pre.node.id);
    }
    const chain = [];
    const seen = new Set();
    let cur = root;
    for (let i = 0; i < 15 && cur && !seen.has(cur.id); i++) {
      seen.add(cur.id);
      if (SEASON_FORMATS.includes(cur.format)) chain.push(cur);
      const nx = nextOf(cur, 'SEQUEL');
      if (!nx) break;
      const next = await get(nx.node.id);
      cur = isLaterSeason(next) ? next : null;   // stop at a new series (e.g. Shippuden, Boruto)
    }
    return { root, chain };
  }

  async function tvmazeSeasonsFor(id) {
    const res = await fetch('https://api.tvmaze.com/shows/' + id + '/episodes');
    if (!res.ok) throw new Error('TVmaze ' + res.status);
    const eps = (await res.json()).filter(e => e.type !== 'insignificant_special' && e.number != null);
    const bySeason = {};
    eps.forEach(e => { bySeason[e.season] = (bySeason[e.season] || 0) + 1; });
    const seasons = Object.keys(bySeason).map(Number).sort((a, b) => a - b).map(n => bySeason[n]);
    return { episodes: eps.length || null, seasons: seasons.length > 1 ? seasons : null };
  }

  // Fallback for anime when AniList can't give the season chain: TVmaze lists most anime as one show.
  async function tvmazeAnimeByName(name) {
    const res = await fetch('https://api.tvmaze.com/singlesearch/shows?q=' + encodeURIComponent(name));
    if (!res.ok) throw new Error('TVmaze ' + res.status);
    const show = await res.json();
    return Object.assign({ minutes: show.averageRuntime || show.runtime || null, airing: show.status === 'Running' }, await tvmazeSeasonsFor(show.id));
  }

  async function showDetails(r) {
    if (r.src === 'tvmaze') {
      try { r = Object.assign({}, r, await tvmazeSeasonsFor(r.id)); }
      catch (e) { r = Object.assign({}, r, { warn: 'Could not load episodes: ' + e.message }); }
    } else if (r.src === 'anilist' && SEASON_FORMATS.includes(r.format)) {
      let done = false;
      try {
        const { root, chain } = await anilistSeasons(r.id);
        const known = chain.length && chain.every(m => m.episodes);
        r = Object.assign({}, r, {
          id: root.id,
          title: aniTitle(root) || r.title,
          image: (root.coverImage && root.coverImage.medium) || r.image,
          minutes: root.duration || r.minutes,
          airing: chain.some(m => m.status === 'RELEASING')
        });
        if (known && chain.length > 1) {
          r.episodes = chain.reduce((a, m) => a + m.episodes, 0);
          r.seasons = chain.map(m => m.episodes);
          done = true;
        } else if (chain.length === 1 && chain[0].episodes) {
          r.episodes = chain[0].episodes;
          done = true;
        }
      } catch (e) {
        r = Object.assign({}, r, { warn: 'AniList: ' + e.message });
      }
      if (!done) {
        try {
          const t = await tvmazeAnimeByName(r.title);
          if (t.episodes) { r = Object.assign({}, r, t, { warn: null }); done = true; }
        } catch (e) {
          r.warn = (r.warn ? r.warn + ' / ' : '') + 'TVmaze: ' + e.message;
        }
      }
    }
    document.getElementById('show-eps').value = r.episodes || '';
    return r;
  }

  // Games go through our Supabase Edge Function so the RAWG key never ships to the browser.
  async function gameApi(params, signal) {
    if (!session) throw new Error('Sign in to search games');
    const token = await accessToken();
    const res = await fetch(SB_URL + '/functions/v1/game-search?' + new URLSearchParams(params), {
      signal, headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token }
    });
    let body = null;
    try { body = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((body && body.error) || ('Game search ' + res.status));
    return body;
  }
  async function searchGames(q, signal) {
    const d = await gameApi({ q }, signal);
    return (d.results || []).map(g => ({
      id: g.id, title: g.name, image: g.image, wide: true,
      meta: [stripYear(g.released), (g.platforms || []).slice(0, 3).join(', ')].filter(Boolean).join(' · ')
    }));
  }
  async function gameDetails(r) {
    const d = await gameApi({ id: r.id });
    const full = Object.assign({}, r, { achievements: d.achievements, playtime: d.playtime, image: d.image || r.image });
    document.getElementById('game-ach').value = d.achievements || '';
    const plats = (d.platforms || []).join(' ').toLowerCase();
    const guess = /pc/.test(plats) ? 'PC' : /playstation/.test(plats) ? 'PS' : /xbox/.test(plats) ? 'Xbox' : /nintendo|switch/.test(plats) ? 'Switch' : null;
    if (guess) {
      formChoice.game.platform = guess;
      document.querySelectorAll('.seg[data-form="game"] button').forEach(b => b.classList.toggle('on', b.dataset.v === guess));
    }
    return full;
  }

  const lookups = window.lookups = {
    show: makeLookup({ kind: 'show', search: (q, sig) => formChoice.show.type === 'anime' ? searchAnilist(q, sig) : searchTvmaze(q, sig), onPick: showDetails }),
    game: makeLookup({ kind: 'game', search: searchGames, onPick: gameDetails })
  };

  // ===== GAMES =====
  const GAME_STATUSES = ['backlog', 'playing', 'beaten', 'hundred'];
  const GAME_BTNS = [
    ['backlog', ICONS.box, 'Backlog'], ['playing', ICONS.play, 'Playing'],
    ['beaten', ICONS.check, 'Beaten'], ['hundred', ICONS.star, '100%']
  ];
  const gameStatus = g => GAME_STATUSES.includes(g.status) ? g.status : 'backlog';
  const findGame = id => games.find(g => g.id === id);
  const gamePct = g => g.achTotal ? Math.min(100, Math.round((g.achDone || 0) / g.achTotal * 100)) : Math.min(100, g.pct || 0);

  function setGameStatus(g, st) {
    if (st === 'hundred' && g.status !== 'hundred') {
      g.doneAt = Date.now();
      if (g.achTotal) g.achDone = g.achTotal; else g.pct = 100;
    }
    if (st !== 'hundred') g.doneAt = null;
    g.status = st;
  }

  function renderGames() {
    const f = filters.game;
    const list = games.filter(g => f === 'all' || g.platform === f);
    const done = list.filter(g => gameStatus(g) === 'hundred').sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    const html =
      section('sec-active', 'Playing', list.filter(g => gameStatus(g) === 'playing'), gameCard) +
      section('sec-next', 'Backlog', list.filter(g => gameStatus(g) === 'backlog'), gameCard) +
      section('sec-next', 'Beaten, not 100%', list.filter(g => gameStatus(g) === 'beaten'), gameCard) +
      section('sec-done', '100%', done, gameCard);
    document.getElementById('games-list').innerHTML = html || '<div class="empty">No games yet</div>';
    const year = new Date().getFullYear();
    document.getElementById('gm-playing').textContent = games.filter(g => gameStatus(g) === 'playing').length;
    document.getElementById('gm-backlog').textContent = games.filter(g => gameStatus(g) === 'backlog').length;
    document.getElementById('gm-done').textContent = games.filter(g => gameStatus(g) === 'hundred').length;
    document.getElementById('gm-year-label').textContent = '100% in ' + year;
    document.getElementById('gm-year').textContent = games.filter(g =>
      gameStatus(g) === 'hundred' && g.doneAt && new Date(g.doneAt).getFullYear() === year).length;
  }

  function gameCard(g) {
    const st = gameStatus(g);
    const hasProg = st === 'playing' || st === 'beaten';
    const label = g.achTotal ? `${g.achDone || 0} / ${g.achTotal}` : `${g.pct || 0}%`;
    const prog = !hasProg ? '' : `
      <div class="prog">
        ${g.achTotal ? '<button class="prog-btn" data-act="step" data-step="-1" aria-label="One less">-1</button>' : ''}
        <button class="prog-num" data-act="set" aria-label="Set progress">${label}</button>
        <button class="prog-btn plus" data-act="step" data-step="1" aria-label="Add progress">${g.achTotal ? '+1 ACH' : '+5%'}</button>
      </div>
      <div class="prog-bar"><i style="width:${gamePct(g)}%"></i></div>`;
    return `
      <div class="card ${st === 'hundred' ? 'is-done' : ''}" data-id="${esc(g.id)}">
        <div class="card-top">
          ${safeCover(g.image) ? `<img class="cover wide" src="${esc(g.image)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
          <div class="card-main">
            <div class="tags">
              <span class="tag">${esc(g.platform || 'Other')}</span>
              ${st === 'hundred' && g.doneAt ? `<span class="tag">${shortDate(g.doneAt)}</span>` : ''}
            </div>
            <div class="card-title">${esc(g.title)}</div>
          </div>
          ${delBtn('game', g.id)}
        </div>
        ${prog}
        ${gameTasks(g)}
        <div class="card-foot">
          <span class="card-len">${g.achTotal ? `<span>${g.achTotal}</span> ACH` : ''}${g.playtime ? ` · ~${g.playtime}H AVG` : ''}</span>
          <div class="status">
            ${GAME_BTNS.map(([v, icon, label]) =>
              `<button class="st ${st === v ? 'active' : ''}" data-act="status" data-state="${v}" aria-label="${label}">${icon}</button>`).join('')}
          </div>
        </div>
      </div>`;
  }

  // Per-game checklist for the things left to 100% it.
  function gameTasks(g) {
    const tasks = isArr(g.tasks) ? g.tasks : [];
    const done = tasks.filter(t => t.done).length;
    const open = openTasks.has(g.id);
    const head = `<button class="tasks-toggle" type="button" data-act="tasks">
      <span>${open ? '▾' : '▸'} 100% CHECKLIST</span><span>${tasks.length ? `<b>${done}</b> / ${tasks.length}` : 'ADD'}</span></button>`;
    if (!open) return head;
    const sorted = tasks.filter(t => !t.done).concat(tasks.filter(t => t.done));
    return head + `
      <div class="tasks">
        ${sorted.map(t => `
          <div class="task ${t.done ? 'done' : ''}">
            <button class="check" type="button" data-act="task" data-task="${esc(t.id)}" aria-label="${t.done ? 'Mark not done' : 'Mark done'}">${ICONS.check}</button>
            <span class="task-text">${esc(t.text)}</span>
            ${delBtn('gtask', g.id + ':' + t.id)}
          </div>`).join('') || '<div class="suggest-status">Nothing yet. Add what is left: collectibles, trophies, side quests.</div>'}
        <form class="task-form" data-game="${esc(g.id)}">
          <input class="add-input" type="text" maxlength="160" autocomplete="off" placeholder="Add a step">
          <button class="add-btn" type="submit">ADD</button>
        </form>
      </div>`;
  }

  document.getElementById('games-list').addEventListener('submit', e => {
    const form = e.target.closest('.task-form');
    if (!form) return;
    e.preventDefault();
    const g = findGame(form.dataset.game);
    const input = form.querySelector('input');
    const text = input.value.trim();
    if (!g || !text) return;
    if (!isArr(g.tasks)) g.tasks = [];
    g.tasks.push({ id: uid('task'), text, done: false });
    save(GAMES_KEY, games);
    renderGames();
    const again = document.querySelector(`.task-form[data-game="${CSS.escape(g.id)}"] input`);
    if (again) again.focus();
  });

  function deleteGameTask(key) {
    const [gid, tid] = key.split(':');
    const g = findGame(gid);
    if (!g || !isArr(g.tasks)) return;
    g.tasks = g.tasks.filter(t => t.id !== tid);
    save(GAMES_KEY, games);
    renderGames();
  }

  document.getElementById('games-list').addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const g = findGame(btn.closest('.card').dataset.id);
    if (!g) return;
    const act = btn.dataset.act;
    if (act === 'tasks') { openTasks.has(g.id) ? openTasks.delete(g.id) : openTasks.add(g.id); renderGames(); return; }
    if (act === 'task') {
      const t = (g.tasks || []).find(x => x.id === btn.dataset.task);
      if (t) { t.done = !t.done; save(GAMES_KEY, games); renderGames(); }
      return;
    }
    if (act === 'status') setGameStatus(g, btn.dataset.state);
    else {
      let n;
      const cur = g.achTotal ? (g.achDone || 0) : (g.pct || 0);
      const max = g.achTotal || 100;
      if (act === 'step') n = cur + (g.achTotal ? toInt(btn.dataset.step) : 5 * toInt(btn.dataset.step));
      else {
        const v = prompt(g.achTotal ? `Achievements done (of ${g.achTotal})` : 'Percent complete (0-100)', cur);
        if (v === null || toInt(v) === null) return;
        n = toInt(v);
      }
      n = Math.max(0, Math.min(n, max));
      if (g.achTotal) g.achDone = n; else g.pct = n;
      if (n === max) setGameStatus(g, 'hundred');
    }
    save(GAMES_KEY, games);
    renderGames();
  });

  function addGame(e) {
    e.preventDefault();
    const titleEl = document.getElementById('game-title');
    const achEl = document.getElementById('game-ach');
    const err = document.getElementById('game-err');
    const title = titleEl.value.trim();
    if (!title) { err.textContent = 'Enter a name'; return false; }
    const platform = formChoice.game.platform;
    if (games.some(g => g.title.toLowerCase() === title.toLowerCase() && g.platform === platform)) {
      err.textContent = 'Already on the list'; return false;
    }
    const pick = lookups.game.picked && lookups.game.picked.title === title ? lookups.game.picked : null;
    const ach = toInt(achEl.value);
    games.unshift({
      id: uid('game'), title, platform, status: 'backlog',
      achTotal: ach > 0 ? Math.min(ach, 5000) : null, achDone: 0, pct: 0,
      image: pick ? safeCover(pick.image) : null,
      playtime: pick && pick.playtime ? pick.playtime : null,
      rawgId: pick ? pick.id : null,
      added: Date.now(), doneAt: null
    });
    save(GAMES_KEY, games);
    titleEl.value = ''; achEl.value = '';
    lookups.game.clear();
    toggleForm('game', false);
    renderGames();
    return false;
  }

  function deleteGame(id) {
    games = games.filter(g => g.id !== id);
    save(GAMES_KEY, games);
    renderGames();
  }

  // ===== TO-DO =====
  const catOf = t => cats.includes(t.cat) ? t.cat : '';

  function renderTodoCats() {
    const count = c => todos.filter(t => !t.done && (c === 'all' || catOf(t) === c)).length;
    const chip = (v, label) => {
      const n = count(v);
      if (catEdit && v !== 'all') return `<button class="chip cat-edit" type="button" data-cat-del="${esc(v)}">${esc(label)}<span class="x">✕</span></button>`;
      return `<button class="chip ${todoCat === v ? 'active' : ''}" type="button" data-cat="${esc(v)}">${esc(label)}${n ? ' ' + n : ''}</button>`;
    };
    document.getElementById('todo-cats').innerHTML =
      chip('all', 'All') + cats.map(c => chip(c, c)).join('') +
      (catEdit
        ? '<button class="chip dashed" type="button" data-cat-act="done">Done</button>'
        : '<button class="chip dashed" type="button" data-cat-act="new">+ New</button><button class="chip dashed" type="button" data-cat-act="edit">Edit</button>');
    document.getElementById('todo-input').placeholder = todoCat === 'all' ? 'Add a to-do' : 'Add to ' + todoCat;
  }

  document.getElementById('todo-cats').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.cat) { todoCat = b.dataset.cat; renderTodos(); return; }
    if (b.dataset.catDel) {
      const c = b.dataset.catDel;
      if (!confirm(`Delete the "${c}" category? Its to-dos stay, with no category.`)) return;
      cats = cats.filter(x => x !== c);
      todos.forEach(t => { if (t.cat === c) t.cat = ''; });
      if (todoCat === c) todoCat = 'all';
      save(CATS_KEY, cats); save(TODOS_KEY, todos);
      renderTodos();
      return;
    }
    const act = b.dataset.catAct;
    if (act === 'new') {
      const name = (prompt('New category name') || '').trim().slice(0, 24);
      if (!name) return;
      if (cats.some(c => c.toLowerCase() === name.toLowerCase())) { todoCat = cats.find(c => c.toLowerCase() === name.toLowerCase()); renderTodos(); return; }
      cats.push(name);
      todoCat = name;
      save(CATS_KEY, cats);
      renderTodos();
    } else if (act === 'edit') { catEdit = true; renderTodoCats(); }
    else if (act === 'done') { catEdit = false; renderTodoCats(); }
  });

  function renderTodos() {
    if (todoCat !== 'all' && !cats.includes(todoCat)) todoCat = 'all';
    renderTodoCats();
    const inView = t => todoCat === 'all' || catOf(t) === todoCat;
    const open = todos.filter(t => !t.done && inView(t)).sort((a, b) => b.created - a.created);
    const done = todos.filter(t => t.done && inView(t)).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    let html = '';
    if (!open.length) html = '<div class="empty">All clear</div>';
    else if (todoCat === 'all') {
      const groups = [''].concat(cats).map(c => [c, open.filter(t => catOf(t) === c)]).filter(g => g[1].length);
      html = groups.length === 1 && groups[0][0] === ''
        ? open.map(todoItem).join('')
        : groups.map(([c, list]) => `
            <div class="list-label todo-cat-head"><span>${esc(c || 'No category')} · ${list.length}</span></div>
            ${list.map(todoItem).join('')}`).join('');
    } else html = open.map(todoItem).join('');

  // ===== SWIPE ON TO-DOS =====
  // Swipe right: toggle done. Swipe left: delete (with undo).
  (function () {
    const panel = document.getElementById('panel-todo');
    let el = null, x0 = 0, y0 = 0, dx = 0, locked = null;
    panel.addEventListener('touchstart', e => {
      const item = e.target.closest('.item');
      if (!item || e.target.closest('button')) { el = null; return; }
      el = item; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; locked = null;
    }, { passive: true });
    panel.addEventListener('touchmove', e => {
      if (!el) return;
      const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
      if (locked === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) locked = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
      if (locked !== 'x') return;
      e.preventDefault();
      dx = mx;
      el.classList.add('swiping');
      el.style.transform = `translateX(${dx}px)`;
      el.classList.toggle('swipe-r', dx > 80);
      el.classList.toggle('swipe-l', dx < -80);
    }, { passive: false });
    panel.addEventListener('touchend', () => {
      if (!el) return;
      const item = el, d = dx;
      el = null;
      item.classList.remove('swiping', 'swipe-r', 'swipe-l');
      item.style.transform = '';
      if (locked !== 'x') return;
      if (d > 80) toggleTodo(item.dataset.id);
      else if (d < -80) deleteTodoUndo(item.dataset.id);
    });
  })();

  function seedShows(extra) {
    const base = SEED_SHOWS.map(s => Object.assign({}, s));
    (extra || []).forEach(c => {
      if (c && c.id && c.title && !base.some(s => s.id === c.id)) {
        base.unshift({ id: c.id, title: c.title, type: c.type === 'live' ? 'live' : 'anime',
          episodes: c.episodes || null, hours: c.hours || 0, added: c.created || Date.now() });
      }
    });
    return base;
  }

  function exportState() {
    const data = JSON.stringify({ version: 5, shows, state, progress, books, games, todos, cats, reminders: notes, look }, null, 2);
    const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'backlog-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importState() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = async e => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const d = JSON.parse(await file.text());
        if (!isObj(d)) throw new Error('Not a Backlog export');
        const v = d.version || 1;
        if (v === 1) { state = d; notes = []; todos = []; progress = {}; books = []; shows = seedShows(); }
        else {
          state = isObj(d.state) ? d.state : {};
          notes = isArr(d.reminders) ? d.reminders : [];
          todos = isArr(d.todos) ? d.todos : [];
          if (isArr(d.cats)) cats = d.cats.filter(c => typeof c === 'string' && c);
          progress = isObj(d.progress) ? d.progress : {};
          books = isArr(d.books) ? d.books : [];
          games = isArr(d.games) ? d.games : [];
          shows = v >= 5 && isArr(d.shows) ? d.shows : seedShows(isArr(d.customShows) ? d.customShows : []);
        }
        saveAll();
        renderAll();
      } catch (err) {
        alert('Import failed: ' + err.message);
      }
    };
    input.click();
  }

  // ===== ACCOUNT + CLOUD SYNC (Supabase) =====

  const SB_URL = 'https://twfrvoelwdizseunrrzj.supabase.co';

  async function sb(path, opts = {}) {
    const headers = Object.assign({ apikey: SB_KEY, 'Content-Type': 'application/json' }, opts.headers || {});
    const res = await fetch(SB_URL + path, Object.assign({}, opts, { headers }));
    let body = null;
    try { body = await res.json(); } catch (e) {}
    if (!res.ok) {
      const msg = (body && (body.msg || body.message || body.error_description || body.error)) || ('HTTP ' + res.status);
      const err = new Error(msg); err.status = res.status; throw err;
    }
    return body;
  }

  function storeSession(t) {
    session = {
      access_token: t.access_token,
      refresh_token: t.refresh_token,
      expires_at: Math.floor(Date.now() / 1000) + (t.expires_in || 3600),
      user_id: t.user && t.user.id,
      email: t.user && t.user.email
    };
    rawSave(SESSION_KEY, session);
  }

  async function accessToken() {
    if (!session) throw new Error('Not signed in');
    if (session.expires_at - 60 > Date.now() / 1000) return session.access_token;
    try {
      const t = await sb('/auth/v1/token?grant_type=refresh_token', {
        method: 'POST', body: JSON.stringify({ refresh_token: session.refresh_token })
      });
      storeSession(Object.assign({ user: { id: session.user_id, email: session.email } }, t));
      return session.access_token;
    } catch (e) {
      if (e.status === 400 || e.status === 401) {
        // Refresh token is dead. Keep local data, ask to sign in again.
        session = null;
        try { localStorage.removeItem(SESSION_KEY); } catch (x) {}
        acct.step = 'email'; acct.msg = 'Signed out. Sign in again to keep syncing.'; acct.err = true;

  async function pushLocal() {
    const token = await accessToken();
    const rows = await sb('/rest/v1/backlog_data?on_conflict=user_id', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, Prefer: 'resolution=merge-duplicates,return=representation' },
      body: JSON.stringify({ user_id: session.user_id, data: snapshot(), updated_at: new Date().toISOString() })
    });
    const row = rows && rows[0];
    setSyncMeta({ dirty: false, syncedAt: row ? row.updated_at : new Date().toISOString() });
  }

  async function syncNow() {
    if (!session || syncing || acct.choice) return;
    if (!navigator.onLine) { acct.status = 'offline'; renderAccount(); return; }
    syncing = true; acct.status = 'busy'; renderAccount();
    try {
      if (syncMeta.dirty) {
        await pushLocal();
      } else {
        const row = await pullRemote();
        if (!row) await pushLocal();
        else if (!syncMeta.syncedAt || new Date(row.updated_at) > new Date(syncMeta.syncedAt)) {
          applyData(row.data);
          setSyncMeta({ syncedAt: row.updated_at, dirty: false });
        }
      }
      acct.status = 'ok'; acct.msg = ''; acct.err = false;
    } catch (e) {
      acct.status = 'bad'; acct.msg = 'Sync failed: ' + e.message; acct.err = true;
    }
    syncing = false;
    renderAccount();
  }

      if (!row || !remoteHas) {
        await pushLocal();
      } else if (!localHasData()) {
        applyData(row.data);
        setSyncMeta({ syncedAt: row.updated_at, dirty: false });
      } else {
        acct.choice = row;   // both have data: let the person pick
      }
      acct.status = 'ok'; acct.msg = ''; acct.err = false;
    } catch (e) {
      acct.status = 'bad'; acct.msg = 'Sync failed: ' + e.message; acct.err = true;
