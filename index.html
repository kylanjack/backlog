        <div class="auth-links">${link('signin', 'Back to password sign-in')}</div>`,
      code: codeField + `<button class="add-btn" type="submit">SIGN IN</button>
        <div class="auth-links">${link('code-email', 'Resend or change email')}${link('signin', 'Use password')}</div>`,
      'reset-email': emailField('username') + `<button class="add-btn" type="submit">SEND RESET CODE</button>
        <div class="auth-links">${link('signin', 'Back to sign in')}</div>`,
      reset: codeField + pwField('new-password', 'New password') + `<button class="add-btn" type="submit">SAVE PASSWORD</button>
        <div class="auth-links">${link('reset-email', 'Resend code')}${link('signin', 'Back to sign in')}</div>`
    }[authMode];
    document.getElementById('auth-card').innerHTML = `
      <form id="auth-form" onsubmit="return submitAuth(event)" novalidate>${body}
        <div class="acct-msg ${authErr ? 'err' : ''}" id="auth-msg">${esc(authMsg)}</div>
      </form>`;
  }

  function setAuthMsg(msg, err) { authMsg = msg; authErr = !!err; const el = document.getElementById('auth-msg'); if (el) { el.textContent = msg; el.className = 'acct-msg' + (err ? ' err' : ''); } }

  async function submitAuth(e) {
    e.preventDefault();
    if (authBusy) return false;
    const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const email = val('auth-email').toLowerCase() || authEmail;
    const pw = document.getElementById('auth-pw') ? document.getElementById('auth-pw').value : '';
    const code = val('auth-code').replace(/\D/g, '');
    if (document.getElementById('auth-email') && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setAuthMsg('Enter a valid email', true); return false; }
    if (document.getElementById('auth-pw') && pw.length < 8) { setAuthMsg('Password needs 8+ characters', true); return false; }
    if (document.getElementById('auth-code') && code.length < 6) { setAuthMsg('Enter the 6-digit code', true); return false; }
    authEmail = email;
    authBusy = true;
    setAuthMsg('Working…', false);
    try {
      if (authMode === 'signin') {
        const t = await sb('/auth/v1/token?grant_type=password', { method: 'POST', body: JSON.stringify({ email, password: pw }) });
        await finishSignIn(t);
      } else if (authMode === 'signup') {
        const t = await sb('/auth/v1/signup', { method: 'POST', body: JSON.stringify({ email, password: pw }) });
        if (t && t.access_token) await finishSignIn(t);
        else { authMode = 'signin'; renderAuth(); setAuthMsg('Account created. Check your email to confirm it, then sign in.', false); }
      } else if (authMode === 'code-email') {
        await sb('/auth/v1/otp', { method: 'POST', body: JSON.stringify({ email, create_user: true }) });
        authMode = 'code'; renderAuth(); setAuthMsg('Code sent. Check your email (and spam).', false);
      } else if (authMode === 'code') {
        const t = await sb('/auth/v1/verify', { method: 'POST', body: JSON.stringify({ type: 'email', email, token: code }) });
        await finishSignIn(t);
      } else if (authMode === 'reset-email') {
        await sb('/auth/v1/recover', { method: 'POST', body: JSON.stringify({ email }) });
        authMode = 'reset'; renderAuth(); setAuthMsg('If that email has an account, a code is on its way.', false);
      } else if (authMode === 'reset') {
        const t = await sb('/auth/v1/verify', { method: 'POST', body: JSON.stringify({ type: 'recovery', email, token: code }) });
        await sb('/auth/v1/user', { method: 'PUT', headers: { Authorization: 'Bearer ' + t.access_token }, body: JSON.stringify({ password: pw }) });
        await finishSignIn(t);
      }
    } catch (err) {
      setAuthMsg(authError(err), true);
    }
    authBusy = false;
    return false;
  }

  async function finishSignIn(t) {
    storeSession(t);
    setSyncMeta({ syncedAt: null, dirty: false });
    try { localStorage.removeItem(GUEST_KEY); } catch (e) {}
    acct.step = 'in'; acct.msg = ''; acct.err = false;
    closeAuth();
    renderAccount();
    await afterSignIn();
  }

  async function resolveChoice(useAccount) {
    const row = acct.choice;
    acct.choice = null;
    try {
      if (useAccount) { applyData(row.data); setSyncMeta({ syncedAt: row.updated_at, dirty: false }); }
      else await pushLocal();
      acct.status = 'ok';
    } catch (e) { acct.status = 'bad'; acct.msg = 'Sync failed: ' + e.message; acct.err = true; }
    renderAccount();
  }

  async function signOut() {
    if (!confirm('Sign out? Your data stays in your account and is removed from this phone.')) return;
    try { if (syncMeta.dirty) await pushLocal(); } catch (e) {
      if (!confirm('Could not save your latest changes to the cloud. Sign out anyway and lose them?')) return;
    }
    try {
      const token = session.access_token;
      fetch(SB_URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token } }).catch(() => {});
    } catch (e) {}
    session = null;
    [SESSION_KEY, SYNC_KEY].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
    syncMeta = { syncedAt: null, dirty: false };
    applyingRemote = true;
    shows = []; state = {}; progress = {}; books = []; games = []; todos = []; notes = [];
    cats = DEFAULT_CATS.slice(); todoCat = 'all';
    saveAll();
    applyingRemote = false;
    acct = { step: 'email', email: '', msg: 'Signed out', err: false, status: 'idle', choice: null };
    renderAll();
    renderAccount();
    openAuth('signin');
  }

  function renderAccount() {
    const box = document.getElementById('account');
    if (!box) return;
    const msg = `<div class="acct-msg ${acct.err ? 'err' : ''}">${esc(acct.msg)}</div>`;
    if (session && acct.choice) {
      box.innerHTML = `
        <span class="field-label">Account</span>
        <div class="acct-who">This phone and your account both have data.</div>
        <div class="font-sample">Pick which to keep. The other is replaced. Export first if unsure.</div>
        <div class="acct-row">
          <button class="ghost-btn" type="button" onclick="resolveChoice(false)">KEEP THIS PHONE</button>
          <button class="add-btn" type="button" onclick="resolveChoice(true)">USE ACCOUNT</button>
        </div>${msg}`;
      return;
    }
    if (session) {
      const st = acct.status;
      const label = st === 'busy' ? 'Syncing…' : st === 'bad' ? 'Not synced' : st === 'offline' ? 'Offline, will sync' :
        syncMeta.syncedAt ? 'Synced ' + new Date(syncMeta.syncedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : 'Not synced yet';
      box.innerHTML = `
        <span class="field-label">Account</span>
        <div class="acct-who">${esc(session.email || '')}</div>
        <div class="font-sample"><span class="sync-dot ${st === 'busy' ? 'busy' : st === 'bad' || st === 'offline' ? 'bad' : syncMeta.syncedAt ? 'ok' : ''}"></span>${label}</div>
        <div class="acct-row">
          <button class="ghost-btn" type="button" onclick="syncNow()">SYNC NOW</button>
          <button class="ghost-btn" type="button" onclick="signOut()">SIGN OUT</button>
        </div>${msg}`;
      return;
    }
    box.innerHTML = `
      <span class="field-label">Account</span>
      <div class="font-sample">Not signed in. Your data is only on this phone.</div>
      <div class="acct-row"><button class="add-btn" type="button" onclick="openAuth('signin')">SIGN IN OR CREATE ACCOUNT</button></div>${msg}`;
  }

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
  window.addEventListener('online', () => syncNow());

  // ===== INIT =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e.message)));
  }
  function renderAll() { renderTodos(); renderShows(); renderBooks(); renderGames(); renderNotes(); }

  (function init() {
    state = load(STATE_KEY, {}, isObj);
    progress = load(PROGRESS_KEY, {}, isObj);
    notes = load(NOTES_KEY, [], isArr);
    todos = load(TODOS_KEY, [], isArr);
    cats = load(CATS_KEY, DEFAULT_CATS.slice(), isArr).filter(c => typeof c === 'string' && c);
    books = load(BOOKS_KEY, [], isArr).filter(b => b && b.id && b.title);
    games = load(GAMES_KEY, [], isArr).filter(g => g && g.id && g.title);
    const saved = load(SHOWS_KEY, null, isArr);
    if (saved) {
      shows = saved.filter(s => s && s.id && s.title);
    } else {
      // First run on this version. Existing users get the starter list plus V2 shows;
      // brand-new installs (new accounts) start empty.
      const hadOldData = localStorage.getItem(STATE_KEY) !== null || localStorage.getItem(OLD_CUSTOM_KEY) !== null;
      shows = hadOldData ? seedShows(load(OLD_CUSTOM_KEY, [], isArr)) : [];
      save(SHOWS_KEY, shows);
      try { localStorage.removeItem(OLD_CUSTOM_KEY); } catch (e) {}
    }
    look = Object.assign({}, LOOK_DEFAULT, load(LOOK_KEY, {}, isObj));
    applyLook();
    renderAll();
    if (session) acct.step = 'in';
    renderAccount();
    if (!session && !load(GUEST_KEY, false, v => v === true)) openAuth('signin');
    setTab('todo');
    if (session) syncNow();
  })();
</script>
</body>
</html>
