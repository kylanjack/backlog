<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Backlog</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Backlog">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1A1C2C">
<meta name="description" content="Shows, to-dos and notes">

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1A1C2C;
    --panel: #333C57;
    --panel-edge: #29366F;
    --panel-hi: #566C86;
    --text: #F4F4F4;
    --muted: #94B0C2;
    --orange: #EF7D57;
    --yellow: #FFCD75;
    --cyan: #73EFF7;
    --green: #A7F070;
    --blue: #41A6F6;
    --red: #B13E53;
    --px: 'Silkscreen', monospace;
    --body: 'Pixelify Sans', monospace;
    --tabbar-h: 64px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.4;
    min-height: 100vh;
  }

  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 20px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 32px);
  }

  /* === HEADER === */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .logo { font-family: var(--px); font-size: 26px; letter-spacing: 1px; }
  .logo span { color: var(--yellow); }
  .tab-label { font-family: var(--px); font-size: 12px; color: var(--muted); }

  /* === STATS === */
  .stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--panel);
    box-shadow: inset 0 -4px 0 var(--panel-edge);
    padding: 12px 12px 14px;
  }
  .stat-label { font-family: var(--px); font-size: 11px; color: var(--muted); display: block; }
  .stat-value { font-family: var(--px); font-size: 26px; line-height: 1.1; }
  .stat-value.y { color: var(--yellow); }
  .stat-value.c { color: var(--cyan); }
  .stat-value.g { color: var(--green); }
  .stat-value.o { color: var(--orange); }

  /* === CHIPS (filters) === */
  .chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    margin: 0 -16px 16px;
    padding: 0 16px 4px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    font-family: var(--px);
    font-size: 11px;
    white-space: nowrap;
    background: var(--panel);
    color: var(--muted);
    padding: 10px 12px;
    min-height: 40px;
    box-shadow: inset 0 -3px 0 var(--panel-edge);
    flex-shrink: 0;
  }
  .chip.active { background: var(--orange); color: var(--bg); box-shadow: inset 0 -3px 0 #B5513A; }

  /* === SECTIONS === */
  .section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 24px 0 10px;
  }
  .section-head .big { font-family: var(--px); font-size: 22px; line-height: 1; }
  .section-head .rule { flex: 1; height: 4px; background: var(--panel); }
  .section-head .count { font-family: var(--px); font-size: 11px; color: var(--muted); }

  .tier-S .big { color: var(--yellow); }
  .tier-A .big { color: var(--orange); }
  .tier-B .big { color: var(--cyan); }
  .tier-C .big { color: var(--muted); }
  .tier-D .big { color: var(--panel-hi); }

  /* === SHOW CARDS === */
  .card {
    background: var(--panel);
    box-shadow: inset 0 -4px 0 var(--panel-edge);
    padding: 14px 14px 16px;
    margin-bottom: 8px;
  }
  .card.hidden { display: none; }
  .card.completed .card-title { text-decoration: line-through; text-decoration-color: var(--green); text-decoration-thickness: 2px; color: var(--muted); }
  .card.rewatched .card-title { color: var(--blue); }

  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag {
    font-family: var(--px);
    font-size: 11px;
    padding: 2px 6px;
    background: var(--bg);
    color: var(--muted);
  }
  .tag.anime { color: var(--orange); }
  .tag.live { color: var(--cyan); }
  .tag.airing { background: var(--yellow); color: var(--bg); }

  .card-title { font-size: 19px; font-weight: 600; line-height: 1.2; margin-bottom: 4px; }

  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
  }
  .card-len { font-family: var(--px); font-size: 12px; color: var(--muted); }
  .card-len span { color: var(--text); }

  .status { display: flex; gap: 6px; }
  .st {
    width: 44px;
    height: 44px;
    background: var(--bg);
    color: var(--panel-hi);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 -3px 0 #11121D;
  }
  .st svg { width: 18px; height: 18px; }
  .st.active[data-state="not-started"] { background: var(--panel-hi); color: var(--text); box-shadow: inset 0 -3px 0 #3E4E62; }
  .st.active[data-state="watching"]    { background: var(--cyan); color: var(--bg); box-shadow: inset 0 -3px 0 #3FB8C2; }
  .st.active[data-state="completed"]   { background: var(--green); color: var(--bg); box-shadow: inset 0 -3px 0 #6FB83F; }
  .st.active[data-state="rewatched"]   { background: var(--blue); color: var(--bg); box-shadow: inset 0 -3px 0 #2A72B0; }

  /* === EPISODE PROGRESS === */
  .prog { display: none; align-items: center; gap: 8px; margin-top: 10px; }
  .card.watching .prog { display: flex; }
  .prog-btn {
    font-family: var(--px);
    font-size: 14px;
    min-width: 44px;
    height: 44px;
    padding: 0 10px;
    background: var(--bg);
    color: var(--muted);
    box-shadow: inset 0 -3px 0 #11121D;
  }
  .prog-btn.plus { background: var(--cyan); color: var(--bg); box-shadow: inset 0 -3px 0 #3FB8C2; flex: 1; }
  .prog-num { font-family: var(--px); font-size: 14px; color: var(--cyan); min-width: 92px; min-height: 44px; text-align: center; text-decoration: underline dotted; text-underline-offset: 4px; }
  .prog-bar { height: 4px; background: var(--bg); margin-top: 8px; display: none; }
  .card.watching .prog-bar { display: block; }
  .prog-bar i { display: block; height: 100%; background: var(--cyan); }
  .tag.custom { color: var(--yellow); }
  .card-del { font-family: var(--px); font-size: 11px; color: var(--panel-hi); margin-left: auto; padding: 4px 0 4px 12px; min-height: 28px; }
  .card-del:active { color: var(--red); }

  /* === ADD SHOW FORM === */
  .add-show-toggle { width: 100%; margin-bottom: 12px; }
  .show-form { display: none; background: var(--panel); box-shadow: inset 0 -4px 0 var(--panel-edge); padding: 14px 14px 18px; margin-bottom: 16px; }
  .show-form.open { display: block; }
  .field-label { font-family: var(--px); font-size: 11px; color: var(--muted); margin: 12px 0 6px; display: block; }
  .field-label:first-child { margin-top: 0; }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1;
    font-family: var(--px);
    font-size: 12px;
    min-height: 44px;
    background: var(--bg);
    color: var(--muted);
    box-shadow: inset 0 -3px 0 #11121D;
  }
  .seg button.on { background: var(--orange); color: var(--bg); box-shadow: inset 0 -3px 0 #B5513A; }
  .show-form .add-input { width: 100%; }
  .form-actions { display: flex; gap: 8px; margin-top: 16px; }
  .form-actions .add-btn { flex: 1; }
  .form-err { font-family: var(--px); font-size: 11px; color: var(--orange); margin-top: 8px; min-height: 14px; }

  .empty-filter { font-family: var(--px); font-size: 12px; color: var(--muted); text-align: center; padding: 32px 0; display: none; }

  /* === ADD FORM === */
  .add-form { display: flex; gap: 8px; margin-bottom: 16px; }
  .add-input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 3px solid var(--panel);
    padding: 12px;
    font-size: 16px;
    border-radius: 0;
    -webkit-appearance: none;
  }
  .add-input:focus { outline: none; border-color: var(--yellow); }
  .add-input::placeholder { color: var(--panel-hi); }
  .add-btn {
    font-family: var(--px);
    font-size: 13px;
    background: var(--yellow);
    color: var(--bg);
    padding: 0 16px;
    min-height: 50px;
    box-shadow: inset 0 -4px 0 #C99A48;
    flex-shrink: 0;
  }
  .add-btn:active, .chip:active, .st:active, .tab:active { transform: translateY(2px); }

  /* === LIST ITEMS (to-do + notes) === */
  .list-label { font-family: var(--px); font-size: 11px; color: var(--muted); margin: 20px 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    box-shadow: inset 0 -4px 0 var(--panel-edge);
    padding: 8px 8px 12px;
    margin-bottom: 6px;
  }
  .check {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    background: var(--bg);
    color: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 -3px 0 #11121D;
  }
  .check svg { width: 20px; height: 20px; visibility: hidden; }
  .item.done .check { background: var(--green); color: var(--bg); box-shadow: inset 0 -3px 0 #6FB83F; }
  .item.done .check svg { visibility: visible; }
  .item-text { flex: 1; min-width: 0; font-size: 16px; overflow-wrap: anywhere; }
  .item.done .item-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--green); }
  .item-date { font-family: var(--px); font-size: 11px; color: var(--muted); flex-shrink: 0; }
  .del {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    color: var(--panel-hi);
    font-family: var(--px);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .del:active { color: var(--red); }
  .note-item { padding-left: 14px; }

  .text-btn {
    font-family: var(--px);
    font-size: 11px;
    color: var(--muted);
    padding: 8px 0;
    min-height: 36px;
  }
  .text-btn.danger { color: var(--red); }

  .empty {
    font-family: var(--px);
    font-size: 12px;
    color: var(--panel-hi);
    text-align: center;
    padding: 32px 0;
  }

  /* === DATA FOOTER === */
  .data {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 4px solid var(--panel);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 18px;
    align-items: center;
  }
  .data .saved { font-family: var(--px); font-size: 11px; color: var(--panel-hi); width: 100%; }

  /* === TABS === */
  .panel { display: none; }
  .panel.active { display: block; }

  .tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-top: 4px solid var(--panel);
    padding: 8px 12px calc(env(safe-area-inset-bottom) + 8px);
    z-index: 10;
  }
  .tabbar-inner { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; }
  .tab {
    flex: 1;
    font-family: var(--px);
    font-size: 13px;
    min-height: 48px;
    background: var(--panel);
    color: var(--muted);
    box-shadow: inset 0 -4px 0 var(--panel-edge);
  }
  .tab.active { background: var(--orange); color: var(--bg); box-shadow: inset 0 -4px 0 #B5513A; }
  .tab .n { font-size: 11px; opacity: .8; margin-left: 4px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="logo">BACK<span>LOG</span></div>
    <div class="tab-label" id="tab-label">SHOWS</div>
  </div>

  <!-- ===== SHOWS ===== -->
  <section class="panel" id="panel-shows">
    <div class="stats">
      <div class="stat"><span class="stat-label">Total</span><span class="stat-value" id="stat-total">0</span></div>
      <div class="stat"><span class="stat-label">Watching</span><span class="stat-value c" id="stat-watching">0</span></div>
      <div class="stat"><span class="stat-label">Done</span><span class="stat-value g" id="stat-completed">0</span></div>
      <div class="stat"><span class="stat-label">Hours left</span><span class="stat-value y" id="stat-hours">0</span></div>
    </div>

    <button class="add-btn add-show-toggle" id="add-show-toggle" onclick="toggleShowForm()">+ ADD SHOW</button>
    <form class="show-form" id="show-form" onsubmit="return addShow(event)">
      <label class="field-label" for="show-title">Name</label>
      <input class="add-input" id="show-title" type="text" maxlength="120" autocomplete="off" placeholder="Show name">
      <span class="field-label">Type</span>
      <div class="seg" data-field="type">
        <button type="button" data-v="anime" class="on">Anime</button>
        <button type="button" data-v="live">Live-action</button>
      </div>
      <span class="field-label">Tier</span>
      <div class="seg" data-field="tier">
        <button type="button" data-v="S">S</button>
        <button type="button" data-v="A">A</button>
        <button type="button" data-v="B" class="on">B</button>
        <button type="button" data-v="C">C</button>
        <button type="button" data-v="D">D</button>
      </div>
      <label class="field-label" for="show-eps">Episodes (optional)</label>
      <input class="add-input" id="show-eps" type="number" inputmode="numeric" min="1" max="5000" placeholder="24">
      <div class="form-err" id="show-err"></div>
      <div class="form-actions">
        <button type="button" class="chip" style="background:var(--bg)" onclick="toggleShowForm(false)">Cancel</button>
        <button type="submit" class="add-btn">SAVE SHOW</button>
      </div>
    </form>

    <div class="chips" id="filters">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="watching">Watching</button>
      <button class="chip" data-filter="not-started">Not started</button>
      <button class="chip" data-filter="completed">Done</button>
      <button class="chip" data-filter="rewatched">Rewatched</button>
      <button class="chip" data-filter="anime">Anime</button>
      <button class="chip" data-filter="live">Live-action</button>
    </div>

    <div id="tiers"></div>
    <div class="empty-filter" id="empty-filter">Nothing here</div>
  </section>

  <!-- ===== TO-DO ===== -->
  <section class="panel" id="panel-todo">
    <form class="add-form" onsubmit="return addTodo(event)">
      <input class="add-input" id="todo-input" type="text" placeholder="Add a to-do" maxlength="200" autocomplete="off">
      <button class="add-btn" type="submit">ADD</button>
    </form>
    <div id="todo-open"></div>
    <div id="todo-done-wrap"></div>
  </section>

  <!-- ===== NOTES ===== -->
  <section class="panel" id="panel-notes">
    <form class="add-form" onsubmit="return addNote(event)">
      <input class="add-input" id="note-input" type="text" placeholder="Show to check out, idea" maxlength="200" autocomplete="off">
      <button class="add-btn" type="submit">SAVE</button>
    </form>
    <div id="notes-list"></div>
  </section>

  <div class="data">
    <span class="saved">Last saved: <span id="sync-time">—</span></span>
    <button class="text-btn" onclick="exportState()">Export</button>
    <button class="text-btn" onclick="importState()">Import</button>
    <button class="text-btn danger" onclick="resetAll()">Reset all</button>
  </div>

</div>

<nav class="tabbar">
  <div class="tabbar-inner">
    <button class="tab" data-tab="shows">SHOWS</button>
    <button class="tab" data-tab="todo">TO-DO<span class="n" id="tab-todo-n"></span></button>
    <button class="tab" data-tab="notes">NOTES<span class="n" id="tab-notes-n"></span></button>
  </div>
</nav>

<script>
  const SHOWS = [
    // ===== S-TIER =====
    { id: 'breaking-bad', title: 'Breaking Bad', type: 'live', tier: 'S', episodes: 62, hours: 49 },
    { id: 'frieren', title: "Frieren: Beyond Journey's End", type: 'anime', tier: 'S', episodes: 28, hours: 11 },
    { id: 'vinland-saga', title: 'Vinland Saga', type: 'anime', tier: 'S', episodes: 48, hours: 19 },
    { id: 'avatar', title: 'Avatar: The Last Airbender', type: 'live', tier: 'S', episodes: 61, hours: 23 },
    { id: 'mob-psycho', title: 'Mob Psycho 100', type: 'anime', tier: 'S', episodes: 37, hours: 15 },
    { id: 'dark', title: 'Dark', type: 'live', tier: 'S', episodes: 26, hours: 24 },
    { id: 'one-piece', title: 'One Piece', type: 'anime', tier: 'S', episodes: 1156, hours: 462, airing: true },

    // ===== A-TIER =====
    { id: 'aot', title: 'Attack on Titan', type: 'anime', tier: 'A', episodes: 94, hours: 38 },
    { id: 'code-geass', title: 'Code Geass', type: 'anime', tier: 'A', episodes: 50, hours: 20 },
    { id: 'death-note', title: 'Death Note', type: 'anime', tier: 'A', episodes: 37, hours: 14 },
    { id: 'rezero', title: 'Re:Zero', type: 'anime', tier: 'A', episodes: 65, hours: 26 },
    { id: '86', title: '86', type: 'anime', tier: 'A', episodes: 23, hours: 9 },
    { id: 'vikings', title: 'Vikings', type: 'live', tier: 'A', episodes: 89, hours: 67 },
    { id: 'jjk', title: 'Jujutsu Kaisen', type: 'anime', tier: 'A', episodes: 47, hours: 19 },
    { id: 'naruto', title: 'Naruto', type: 'anime', tier: 'A', episodes: 220, hours: 84 },
    { id: 'shippuden', title: 'Naruto Shippuden', type: 'anime', tier: 'A', episodes: 500, hours: 192 },

    // ===== B-TIER =====
    { id: 'solo-leveling', title: 'Solo Leveling', type: 'anime', tier: 'B', episodes: 25, hours: 10 },
    { id: 'suits', title: 'Suits', type: 'live', tier: 'B', episodes: 134, hours: 94 },
    { id: 'big-bang-theory', title: 'The Big Bang Theory', type: 'live', tier: 'B', episodes: 279, hours: 98 },
    { id: 'dandadan', title: 'Dan Da Dan', type: 'anime', tier: 'B', episodes: 24, hours: 10 },
    { id: 'hells-paradise', title: "Hell's Paradise", type: 'anime', tier: 'B', episodes: 13, hours: 5 },
    { id: 'witch-hat', title: 'Witch Hat Atelier', type: 'anime', tier: 'B', episodes: 12, hours: 5, airing: true },
    { id: 'dragon-ball', title: 'Dragon Ball', type: 'anime', tier: 'B', episodes: 153, hours: 61 },
    { id: 'sentenced', title: 'Sentenced to Be a Hero', type: 'anime', tier: 'B', episodes: 12, hours: 6 },

    // ===== C-TIER =====
    { id: 'soul-eater', title: 'Soul Eater', type: 'anime', tier: 'C', episodes: 51, hours: 20 },
    { id: 'tower-of-god', title: 'Tower of God', type: 'anime', tier: 'C', episodes: 25, hours: 10 },
    { id: 'shangri-la', title: 'Shangri-La Frontier', type: 'anime', tier: 'C', episodes: 25, hours: 10 },
    { id: 'lost-in-space', title: 'Lost in Space', type: 'live', tier: 'C', episodes: 28, hours: 23 },
    { id: 'falling-skies', title: 'Falling Skies', type: 'live', tier: 'C', episodes: 52, hours: 37 },

    // ===== D-TIER =====
    { id: 'kingdoms-ruin', title: 'The Kingdoms of Ruin', type: 'anime', tier: 'D', episodes: 12, hours: 5 },
    { id: 'gachiakuta', title: 'Gachiakuta', type: 'anime', tier: 'D', episodes: 12, hours: 5, airing: true },
    { id: 'daemons', title: 'Daemons of the Shadow Realm', type: 'anime', tier: 'D', episodes: 12, hours: 5 },
  ];

  const TIERS = ['S', 'A', 'B', 'C', 'D'];
  const STATUSES = ['not-started', 'watching', 'completed', 'rewatched'];

  // Storage keys. The first two are from the original Backlog — do not rename or existing data is lost.
  const STATE_KEY = 'watchlist:state';
  const NOTES_KEY = 'watchlist:reminders';
  const TODOS_KEY = 'backlog:todos';
  const CUSTOM_KEY = 'backlog:custom-shows';
  const PROGRESS_KEY = 'backlog:progress';

  let state = {};
  let notes = [];
  let todos = [];
  let customShows = [];
  let progress = {};
  let currentFilter = 'all';

  // ===== STORAGE =====
  function load(key, fallback, check) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return fallback;
      const parsed = JSON.parse(raw);
      return check(parsed) ? parsed : fallback;
    } catch (e) {
      console.warn('Could not load ' + key + ':', e.message);
      return fallback;
    }
  }
  function save(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      updateSyncTime();
    } catch (e) {
      console.warn('Could not save ' + key + ':', e.message);
    }
  }
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const isArr = v => Array.isArray(v);

  function updateSyncTime() {
    const el = document.getElementById('sync-time');
    if (el) el.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function uid(prefix) {
    return prefix + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
  }

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function shortDate(ts) {
    const d = new Date(ts);
    const sameYear = d.getFullYear() === new Date().getFullYear();
    return d.toLocaleDateString([], sameYear ? { month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric', year: '2-digit' });
  }

  // ===== TABS =====
  function setTab(name) {
    if (!['shows', 'todo', 'notes'].includes(name)) name = 'shows';
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.getElementById('tab-label').textContent = { shows: 'SHOWS', todo: 'TO-DO', notes: 'NOTES' }[name];
    window.scrollTo(0, 0);
  }
  document.querySelector('.tabbar').addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (t) setTab(t.dataset.tab);
  });

  function updateTabCounts() {
    const open = todos.filter(t => !t.done).length;
    document.getElementById('tab-todo-n').textContent = open ? open : '';
    document.getElementById('tab-notes-n').textContent = notes.length ? notes.length : '';
  }

  // ===== SHOWS =====
  const allShows = () => SHOWS.concat(customShows);
  const findShow = id => allShows().find(s => s.id === id);
  const getProg = id => Math.max(0, parseInt(progress[id], 10) || 0);
  const isDoneShow = s => ['completed', 'rewatched'].includes(getStatus(s.id));
  function hoursLeft(s) {
    if (isDoneShow(s)) return 0;
    if (!s.episodes) return s.hours || 0;
    const left = Math.max(0, s.episodes - getProg(s.id));
    return (s.hours || 0) * left / s.episodes;
  }
  const getStatus = id => STATUSES.includes(state[id]) ? state[id] : 'not-started';

  const ICONS = {
    'not-started': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" shape-rendering="crispEdges"><rect x="5" y="5" width="14" height="14"/></svg>',
    'watching':    '<svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges"><path d="M7 4h3v2h3v2h3v2h3v4h-3v2h-3v2h-3v2H7z"/></svg>',
    'completed':   '<svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges"><path d="M19 6h3v3h-3v3h-3v3h-3v3h-3v3H7v-3H4v-3H1v-3h3v3h3v3h3v-3h3v-3h3V9h3z"/></svg>',
    'rewatched':   '<svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges"><path d="M6 4h12v3h3v6h-3V7H6v3h3v3H3V7h3zM18 20H6v-3H3v-6h3v6h12v-3h-3v-3h6v6h-3z"/></svg>'
  };
  const STATUS_LABEL = { 'not-started': 'Not started', 'watching': 'Watching', 'completed': 'Done', 'rewatched': 'Rewatched' };

  function renderShows() {
    const root = document.getElementById('tiers');
    root.innerHTML = TIERS.map(tier => {
      const shows = allShows().filter(s => s.tier === tier);
      if (!shows.length) return '';
      return `
        <div class="tier-block" data-tier="${tier}">
          <div class="section-head tier-${tier}">
            <span class="big">${tier}</span>
            <span class="rule"></span>
            <span class="count" data-count></span>
          </div>
          ${shows.map(renderCard).join('')}
        </div>`;
    }).join('');
  }

  function progLabel(s) {
    const n = getProg(s.id);
    return s.episodes ? `EP ${n} / ${s.episodes}` : `EP ${n}`;
  }
  function progPct(s) {
    return s.episodes ? Math.min(100, Math.round(getProg(s.id) / s.episodes * 100)) : 0;
  }

  function renderCard(s) {
    const status = getStatus(s.id);
    return `
      <div class="card ${status}" data-id="${s.id}" data-type="${s.type}" data-status="${status}">
        <div class="tags">
          <span class="tag ${s.type}">${s.type === 'anime' ? 'Anime' : 'Live-action'}</span>
          ${s.airing ? '<span class="tag airing">Airing</span>' : ''}
          ${s.custom ? `<span class="tag custom">Added</span><button class="card-del" data-del="${s.id}" aria-label="Delete show">Delete</button>` : ''}
        </div>
        <div class="card-title">${esc(s.title)}</div>
        <div class="prog">
          <button class="prog-btn" data-step="-1" aria-label="Back one episode">-1</button>
          <button class="prog-num" data-prog aria-label="Set episode">${progLabel(s)}</button>
          <button class="prog-btn plus" data-step="1" aria-label="Watched one more episode">+1 EP</button>
        </div>
        <div class="prog-bar"><i data-bar style="width:${progPct(s)}%"></i></div>
        <div class="card-foot">
          <span class="card-len">${s.episodes ? `<span>${s.episodes}</span> EP` : '? EP'}${s.hours ? ` · ~${Math.round(s.hours)}H` : ''}</span>
          <div class="status" role="group" aria-label="Watch status">
            ${STATUSES.map(st => `
              <button class="st ${status === st ? 'active' : ''}" data-state="${st}" aria-label="${STATUS_LABEL[st]}" title="${STATUS_LABEL[st]}">${ICONS[st]}</button>
            `).join('')}
          </div>
        </div>
      </div>`;
  }

  document.getElementById('tiers').addEventListener('click', e => {
    const st = e.target.closest('.st');
    if (st) {
      e.stopPropagation();
      setStatus(st.closest('.card').dataset.id, st.dataset.state);
      return;
    }
    const step = e.target.closest('.prog-btn');
    if (step) {
      e.stopPropagation();
      stepEpisode(step.closest('.card').dataset.id, parseInt(step.dataset.step, 10));
      return;
    }
    const num = e.target.closest('.prog-num');
    if (num) {
      e.stopPropagation();
      const id = num.closest('.card').dataset.id;
      const v = prompt('Episode you are on', getProg(id));
      if (v === null) return;
      const n = parseInt(v, 10);
      if (!isNaN(n)) stepEpisode(id, n - getProg(id));
      return;
    }
    const del = e.target.closest('.card-del');
    if (del) {
      e.stopPropagation();
      deleteShow(del.dataset.del);
    }
  });

  function stepEpisode(id, delta) {
    const s = findShow(id);
    if (!s) return;
    let n = getProg(id) + delta;
    if (n < 0) n = 0;
    if (s.episodes && n > s.episodes) n = s.episodes;
    progress[id] = n;
    save(PROGRESS_KEY, progress);
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) {
      card.querySelector('[data-prog]').textContent = progLabel(s);
      card.querySelector('[data-bar]').style.width = progPct(s) + '%';
    }
    if (s.episodes && n === s.episodes && delta > 0) {
      setStatus(id, 'completed');
    } else {
      updateStats();
    }
  }

  // ===== ADD / DELETE SHOWS =====
  const showForm = { type: 'anime', tier: 'B' };

  function toggleShowForm(force) {
    const form = document.getElementById('show-form');
    const open = typeof force === 'boolean' ? force : !form.classList.contains('open');
    form.classList.toggle('open', open);
    document.getElementById('add-show-toggle').style.display = open ? 'none' : '';
    document.getElementById('show-err').textContent = '';
    if (open) document.getElementById('show-title').focus();
  }

  document.getElementById('show-form').addEventListener('click', e => {
    const b = e.target.closest('.seg button');
    if (!b) return;
    e.stopPropagation();
    const seg = b.parentElement;
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    showForm[seg.dataset.field] = b.dataset.v;
  });
  document.getElementById('show-title').addEventListener('input', () => {
    document.getElementById('show-err').textContent = '';
  });

  function addShow(e) {
    e.preventDefault();
    const titleEl = document.getElementById('show-title');
    const epsEl = document.getElementById('show-eps');
    const title = titleEl.value.trim();
    const err = document.getElementById('show-err');
    if (!title) { err.textContent = 'Enter a name'; return false; }
    if (allShows().some(s => s.title.toLowerCase() === title.toLowerCase())) { err.textContent = 'Already on the list'; return false; }
    const eps = parseInt(epsEl.value, 10);
    const episodes = eps > 0 ? Math.min(eps, 5000) : null;
    const perEp = showForm.type === 'anime' ? 0.4 : 0.75;
    customShows.push({
      id: uid('custom'),
      title,
      type: showForm.type,
      tier: showForm.tier,
      episodes,
      hours: episodes ? Math.round(episodes * perEp) : 0,
      custom: true,
      created: Date.now()
    });
    save(CUSTOM_KEY, customShows);
    titleEl.value = '';
    epsEl.value = '';
    toggleShowForm(false);
    renderShows();
    updateStats();
    applyFilter();
    return false;
  }

  function deleteShow(id) {
    const s = customShows.find(x => x.id === id);
    if (!s) return;
    if (!confirm('Delete "' + s.title + '"?')) return;
    customShows = customShows.filter(x => x.id !== id);
    delete state[id];
    delete progress[id];
    save(CUSTOM_KEY, customShows);
    save(STATE_KEY, state);
    save(PROGRESS_KEY, progress);
    renderShows();
    updateStats();
    applyFilter();
  }

  function setStatus(id, status) {
    if (!STATUSES.includes(status)) return;
    state[id] = status;
    save(STATE_KEY, state);
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) {
      card.className = 'card ' + status;
      card.dataset.status = status;
      card.querySelectorAll('.st').forEach(b => b.classList.toggle('active', b.dataset.state === status));
    }
    updateStats();
    applyFilter();
  }

  function updateStats() {
    const shows = allShows();
    document.getElementById('stat-total').textContent = shows.length;
    document.getElementById('stat-watching').textContent = shows.filter(s => getStatus(s.id) === 'watching').length;
    document.getElementById('stat-completed').textContent = shows.filter(isDoneShow).length;
    document.getElementById('stat-hours').textContent = Math.round(shows.reduce((a, s) => a + hoursLeft(s), 0));
  }

  function applyFilter() {
    let anyVisible = false;
    document.querySelectorAll('.tier-block').forEach(block => {
      let n = 0;
      block.querySelectorAll('.card').forEach(card => {
        let show;
        if (currentFilter === 'all') show = true;
        else if (currentFilter === 'anime' || currentFilter === 'live') show = card.dataset.type === currentFilter;
        else show = card.dataset.status === currentFilter;
        card.classList.toggle('hidden', !show);
        if (show) n++;
      });
      block.style.display = n ? '' : 'none';
      block.querySelector('[data-count]').textContent = n + (n === 1 ? ' TITLE' : ' TITLES');
      if (n) anyVisible = true;
    });
    document.getElementById('empty-filter').style.display = anyVisible ? 'none' : 'block';
  }

  document.getElementById('filters').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
    currentFilter = chip.dataset.filter;
    applyFilter();
  });

  // ===== TO-DO =====
  function renderTodos() {
    const open = todos.filter(t => !t.done).sort((a, b) => b.created - a.created);
    const done = todos.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));

    document.getElementById('todo-open').innerHTML = open.length
      ? open.map(todoItem).join('')
      : '<div class="empty">All clear</div>';

    document.getElementById('todo-done-wrap').innerHTML = done.length ? `
      <div class="list-label"><span>Done · ${done.length}</span><button class="text-btn" onclick="clearDone()">Clear done</button></div>
      ${done.map(todoItem).join('')}` : '';

    updateTabCounts();
  }

  function todoItem(t) {
    return `
      <div class="item ${t.done ? 'done' : ''}">
        <button class="check" onclick="toggleTodo('${t.id}')" aria-label="${t.done ? 'Mark not done' : 'Mark done'}">${ICONS.completed}</button>
        <span class="item-text">${esc(t.text)}</span>
        <button class="del" onclick="deleteTodo('${t.id}')" aria-label="Delete">X</button>
      </div>`;
  }

  function addTodo(e) {
    e.preventDefault();
    const input = document.getElementById('todo-input');
    const text = input.value.trim();
    if (!text) return false;
    todos.push({ id: uid('todo'), text, done: false, created: Date.now() });
    save(TODOS_KEY, todos);
    input.value = '';
    renderTodos();
    return false;
  }

  function toggleTodo(id) {
    const t = todos.find(x => x.id === id);
    if (!t) return;
    t.done = !t.done;
    t.doneAt = t.done ? Date.now() : null;
    save(TODOS_KEY, todos);
    renderTodos();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    save(TODOS_KEY, todos);
    renderTodos();
  }

  function clearDone() {
    todos = todos.filter(t => !t.done);
    save(TODOS_KEY, todos);
    renderTodos();
  }

  // ===== NOTES =====
  function renderNotes() {
    const sorted = [...notes].sort((a, b) => b.created - a.created);
    document.getElementById('notes-list').innerHTML = sorted.length
      ? sorted.map(n => `
          <div class="item note-item">
            <span class="item-text">${esc(n.text)}</span>
            <span class="item-date">${shortDate(n.created)}</span>
            <button class="del" onclick="deleteNote('${n.id}')" aria-label="Delete">X</button>
          </div>`).join('')
      : '<div class="empty">No notes</div>';
    updateTabCounts();
  }

  function addNote(e) {
    e.preventDefault();
    const input = document.getElementById('note-input');
    const text = input.value.trim();
    if (!text) return false;
    notes.push({ id: uid('rem'), text, created: Date.now() });
    save(NOTES_KEY, notes);
    input.value = '';
    renderNotes();
    return false;
  }

  function deleteNote(id) {
    notes = notes.filter(n => n.id !== id);
    save(NOTES_KEY, notes);
    renderNotes();
  }

  // ===== EXPORT / IMPORT / RESET =====
  function exportState() {
    const data = JSON.stringify({ version: 4, state, reminders: notes, todos, customShows, progress }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'backlog-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importState() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = async e => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        if (!isObj(parsed)) throw new Error('Not a Backlog export');
        if ([2, 3, 4].includes(parsed.version)) {
          state = isObj(parsed.state) ? parsed.state : {};
          notes = isArr(parsed.reminders) ? parsed.reminders : [];
          if (parsed.version >= 3) todos = isArr(parsed.todos) ? parsed.todos : [];
          if (parsed.version >= 4) {
            customShows = isArr(parsed.customShows) ? parsed.customShows : [];
            progress = isObj(parsed.progress) ? parsed.progress : {};
          }
        } else {
          state = parsed; // v1: bare state object
        }
        save(STATE_KEY, state);
        save(NOTES_KEY, notes);
        save(TODOS_KEY, todos);
        save(CUSTOM_KEY, customShows);
        save(PROGRESS_KEY, progress);
        renderAll();
      } catch (err) {
        alert('Import failed: ' + err.message);
      }
    };
    input.click();
  }

  function resetAll() {
    if (!confirm('Wipe all show progress, added shows, to-dos and notes? Export first if you want a backup.')) return;
    state = {}; notes = []; todos = []; customShows = []; progress = {};
    [STATE_KEY, NOTES_KEY, TODOS_KEY, CUSTOM_KEY, PROGRESS_KEY].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
    renderAll();
  }

  // ===== INIT =====
  function renderAll() {
    renderShows();
    updateStats();
    applyFilter();
    renderTodos();
    renderNotes();
  }

  (function init() {
    state = load(STATE_KEY, {}, isObj);
    notes = load(NOTES_KEY, [], isArr);
    todos = load(TODOS_KEY, [], isArr);
    customShows = load(CUSTOM_KEY, [], isArr).filter(s => s && s.id && s.title && TIERS.includes(s.tier));
    progress = load(PROGRESS_KEY, {}, isObj);
    renderAll();
    setTab('todo');
  })();
</script>
</body>
</html>
